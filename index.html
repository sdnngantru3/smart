  <!-- CODE GAS & GUIDES TEMPLATES (HIDDEN DATA SOURCE FOR MODALS) -->
  <template id="tpl-apps-script-code">// =================================================================
// BACKEND GOOGLE APPS SCRIPT - SISTEM PEMBELAJARAN DIGITAL
// =================================================================
var REQUEST_SPREADSHEET_ID = '';

function getRequestSpreadsheet_() {
  return REQUEST_SPREADSHEET_ID ? SpreadsheetApp.openById(REQUEST_SPREADSHEET_ID) : SpreadsheetApp.getActiveSpreadsheet();
}

function hasHtmlFile_(name) {
  try { DriveApp.getFilesByName(name + '.html'); return true; } catch (e) { return false; }
}

function doGet(e) {
  e = e || { parameter: {} };
  var params = e.parameter || {};
  var action = params.action || '';

  // API-first: GitHub Pages menggunakan endpoint ini. Tidak lagi bergantung pada index.html di Apps Script.
  if (action) {
    REQUEST_SPREADSHEET_ID = String(params.spreadsheetId || params.SPREADSHEET_ID || '').trim();
    return handleRequest(action, params, params);
  }

  // Backward compatibility: bila file kuis masih berada di Apps Script, tetap bisa dibuka.
  if (params.page === 'kuis') {
    try {
      return HtmlService.createHtmlOutputFromFile('kuis')
        .setTitle('Kuis Interaktif - EduSmart LMS')
        .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
    } catch (err) {
      return jsonOutput_({success:false, message:'File kuis tidak ada di project Apps Script. Gunakan kuis.html dari GitHub Pages.', data:null});
    }
  }

  return jsonOutput_({
    success: true,
    message: 'EduSmart LMS API aktif. Gunakan parameter action untuk memanggil API.',
    data: { service: 'EduSmart LMS Google Apps Script API', version: 'GitHub Pages API v1' }
  });
}

function doPost(e) {
  e = e || { parameter: {}, postData: { contents: '' } };
  var params = e.parameter || {};
  var body = {};
  var raw = e.postData &amp;&amp; e.postData.contents ? String(e.postData.contents) : '';
  if (raw) {
    try { body = JSON.parse(raw); } catch (err) {
      // GitHub Pages mengirim application/x-www-form-urlencoded agar request CORS tetap sederhana.
      body = {};
    }
  }
  // Form-urlencoded juga tersedia melalui e.parameter. Salin field JSON yang dikirim frontend.
  Object.keys(params).forEach(function(k) {
    if (body[k] === undefined) body[k] = params[k];
  });
  // Field kompleks dari GitHub Pages dikirim sebagai string JSON.
  ['records', 'result', 'intent'].forEach(function(k) {
    if (typeof body[k] === 'string') {
      var rawValue = String(body[k]).trim();
      if (rawValue &amp;&amp; (rawValue[0] === '[' || rawValue[0] === '{')) {
        try { body[k] = JSON.parse(rawValue); } catch (ignore) {}
      }
    }
  });
  var action = params.action || body.action || '';
  REQUEST_SPREADSHEET_ID = String(body.spreadsheetId || body.SPREADSHEET_ID || params.spreadsheetId || params.SPREADSHEET_ID || '').trim();
  return handleRequest(action, params, body);
}

function handleRequest(action, params, body) {
  action = String(action || (body &amp;&amp; body.action) || (params &amp;&amp; params.action) || '').trim();
  params = params || {};
  body = body || {};
  if (!REQUEST_SPREADSHEET_ID) {
    REQUEST_SPREADSHEET_ID = String(body.spreadsheetId || body.SPREADSHEET_ID || params.spreadsheetId || params.SPREADSHEET_ID || '').trim();
  }

  var result = { success: false, message: 'Action tidak dikenal: ' + action, data: null };
  try {
    var ss = getRequestSpreadsheet_();
    if (action === 'health') {
      result = { success: true, message: 'EduSmart LMS API aktif.', data: { service: 'Google Apps Script API', spreadsheetId: ss.getId(), title: ss.getName() } };
    }
    else if (action === 'testConnection') {
      result = { success: true, message: 'Koneksi ke Google Spreadsheet Berhasil!', data: { title: ss.getName(), spreadsheetId: ss.getId() } };
    }
    else if (action === 'setupDatabase') result = setupDatabase();
    else if (action === 'saveAppConfig') result = saveAppConfigToSheet(body || {});
    else if (action === 'getAppConfig') result = { success: true, message: 'OK', data: getAppConfigFromSheet() };
    else if (action === 'login') result = body &amp;&amp; body.spreadsheetId ? loginUserBySpreadsheetId(body.spreadsheetId, body.username, body.password, body.role) : loginUser(body.username, body.password, body.role);
    else if (action === 'getGuruProfile') result = getGuruProfile(body || {});
    else if (action === 'saveGuruProfile') result = saveGuruProfile(body || {});
    else if (action === 'getMenuGuru') result = getMenuGuru(body || {});
    else if (action === 'saveMenuGuru') result = saveMenuGuru(body || {});
    else if (action === 'deleteMenuGuru') result = deleteMenuGuru(body || {});
    else if (action === 'reorderMenuGuru') result = reorderMenuGuru(body || {});
    else if (action === 'getStudents') result = getStudentsByClass((body &amp;&amp; body.kelas) || params.kelas || '');
    else if (action === 'saveStudent') result = saveStudentAndCreateUser(body);
    else if (action === 'importStudents') result = importStudentsAndCreateUsers(body.records || []);
    else if (action === 'deleteStudent') result = deleteStudentAndUser(body.key);
    else if (action === 'getSubjects') result = getSheetData('MasterMapel');
    else if (action === 'saveSubject') result = addOrUpdateRow('MasterMapel', body, 'Kode');
    else if (action === 'importSubjects') result = importRowsToSheet('MasterMapel', body.records || [], 'Kode');
    else if (action === 'getAttendance') result = getSheetData('Absensi');
    else if (action === 'saveAttendance') result = appendMultipleRows('Absensi', body.records);
    else if (action === 'importAttendance') result = importRowsToSheet('Absensi', body.records || [], 'ID');
    else if (action === 'getGrades') result = getSheetData('Nilai');
    else if (action === 'saveGrade') result = addOrUpdateRow('Nilai', body, 'ID');
    else if (action === 'importGrades') result = importRowsToSheet('Nilai', body.records || [], 'ID');
    else if (action === 'getJournals') result = getSheetData('Jurnal');
    else if (action === 'saveJournal') result = addOrUpdateRow('Jurnal', body, 'ID');
    else if (action === 'importJournals') result = importRowsToSheet('Jurnal', body.records || [], 'ID');
    else if (action === 'getQuizzes') result = getSheetData('Kuis');
    else if (action === 'getQuizQuestions') result = getSheetData('SoalKuis');
    else if (action === 'saveQuizResult') result = addOrUpdateRow('HasilKuis', body, 'ID');
    else if (action === 'getQuizResults') result = getSheetData('HasilKuis');
    else if (action === 'getAnnouncements') result = getSheetData('Pengumuman');
    else if (action === 'saveAnnouncement') result = addOrUpdateRow('Pengumuman', body, 'ID');
    else if (action === 'importAnnouncements') result = importRowsToSheet('Pengumuman', body.records || [], 'ID');
    else if (action === 'getOpenAiStatus') result = getOpenAiStatus(body || {});
    else if (action === 'saveOpenAiApiKey') result = saveOpenAiApiKey(body || {});
    else if (action === 'haloHalo') result = haloHalo(body || {});
    else if (action === 'haloHaloConfirm') result = haloHaloConfirm(body || {});
    else if (action === 'resetDatabase') result = clearAllData();
    else if (action === 'quizGetConfig') result = quizGetConfig(body.spreadsheetId || REQUEST_SPREADSHEET_ID);
    else if (action === 'quizLogin') result = quizLogin(body.spreadsheetId || REQUEST_SPREADSHEET_ID, body.username, body.password);
    else if (action === 'getInteractiveQuizData') result = getInteractiveQuizData(body.spreadsheetId || REQUEST_SPREADSHEET_ID, body.nis, body.kelas);
    else if (action === 'saveInteractiveQuizResult') result = saveInteractiveQuizResult(body.spreadsheetId || REQUEST_SPREADSHEET_ID, body.result);
  } catch(err) {
    result = { success: false, message: err &amp;&amp; err.message ? err.message : String(err), data: null };
  }
  return jsonOutput_(result);
}

function jsonOutput_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj || {})).setMimeType(ContentService.MimeType.JSON);
}

function getDatabaseSchemas() {
  return {
    'Config': ['Key', 'Value', 'Description', 'UpdatedAt'],
    'Users': ['ID', 'Username', 'Password', 'Nama', 'Role', 'NIS', 'NIP', 'Kelas', 'Status', 'CreatedAt', 'UpdatedAt'],
    'Guru': ['NIP', 'Nama', 'Email', 'NoHP', 'MapelUtama'],
    'Siswa': ['NIS', 'NISN', 'Nama', 'JenisKelamin', 'TempatLahir', 'TanggalLahir', 'Alamat', 'Kelas', 'NamaOrangTua', 'NoHP', 'Status'],
    'MasterMapel': ['Kode', 'NamaMapel', 'Guru', 'Kelas', 'Status'],
    'Absensi': ['ID', 'Tanggal', 'Kelas', 'KodeMapel', 'NIS', 'NamaSiswa', 'StatusHadir'],
    'Nilai': ['ID', 'Kelas', 'KodeMapel', 'NIS', 'NamaSiswa', 'JenisPenilaian', 'Nilai', 'Tanggal'],
    'Jurnal': ['ID', 'Tanggal', 'Kelas', 'KodeMapel', 'Materi', 'Kegiatan', 'Catatan'],
    'Kuis': ['ID', 'Judul', 'KodeMapel', 'Kelas', 'JumlahSoal', 'DurasiMenit'],
    'SoalKuis': ['ID', 'KuisID', 'Pertanyaan', 'OpsiA', 'OpsiB', 'OpsiC', 'OpsiD', 'KunciJawaban'],
    'HasilKuis': ['ID', 'KuisID', 'NIS', 'NamaSiswa', 'Benar', 'Salah', 'Nilai', 'Tanggal'],
    'Pengumuman': ['ID', 'Tanggal', 'Judul', 'Isi', 'TargetRole', 'TargetKelas', 'Pembuat'],
    'Aktivitas': ['ID', 'Waktu', 'User', 'Aktivitas'],
    'Game': ['ID', 'NamaGame', 'Pemain', 'Skor', 'Waktu'],
    'MenuGuru': ['ID', 'NamaMenu', 'Ikon', 'Tipe', 'Target', 'TargetTab', 'Urutan', 'Status', 'CreatedAt', 'UpdatedAt']
  };
}

function ensureDatabaseSheets() {
  var ss = getRequestSpreadsheet_();
  var schemas = getDatabaseSchemas();
  var created = [];
  var repaired = [];
  var sheetNames = Object.keys(schemas);

  sheetNames.forEach(function(sheetName) {
    var headers = schemas[sheetName];
    var sheet = ss.getSheetByName(sheetName);
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      created.push(sheetName);
    } else if (sheet.getLastRow() === 0) {
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      repaired.push(sheetName);
    } else {
      var width = Math.max(sheet.getLastColumn(), headers.length);
      var current = sheet.getRange(1, 1, 1, width).getValues()[0];
      var mismatch = false;
      for (var i = 0; i &lt; headers.length; i++) {
        if (String(current[i] == null ? '' : current[i]).trim() !== headers[i]) {
          mismatch = true;
          break;
        }
      }
      if (mismatch &amp;&amp; sheet.getLastRow() &lt;= 1) {
        sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
        repaired.push(sheetName);
      }
    }
    sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#e2e8f0');
    if (sheet.getFrozenRows() &lt; 1) sheet.setFrozenRows(1);
  });

  return { created: created, repaired: repaired, total: sheetNames.length, names: sheetNames };
}

function setupDatabase() {
  var setupInfo = ensureDatabaseSheets();
  ensureDefaultTeacherAccount();
  syncAllStudentUsers();
  saveAppConfigToSheet();
  return {
    success: true,
    message: 'Semua sheet database berhasil dibuat/diperiksa. ' + setupInfo.total + ' sheet siap digunakan.',
    data: { config: getAppConfigFromSheet(), sheets: setupInfo }
  };
}

function saveAppConfigToSheet(input) {
  var ss = getRequestSpreadsheet_();
  ensureDatabaseSheets();
  var sheet = ss.getSheetByName('Config');
  if (!sheet) {
    sheet = ss.insertSheet('Config');
    sheet.appendRow(['Key', 'Value', 'Description', 'UpdatedAt']);
    sheet.getRange(1, 1, 1, 4).setFontWeight('bold').setBackground('#e2e8f0');
  }

  input = input || {};
  var existingConfig = getAppConfigFromSheet();
  var spreadsheetId = String(input.SPREADSHEET_ID || existingConfig.SPREADSHEET_ID || ss.getId()).trim();
  var scriptUrl = String(input.APPSCRIPT_URL || input.WEB_APP_URL || existingConfig.APPSCRIPT_URL || '').trim();
  var scriptId = String(existingConfig.SCRIPT_ID || '').trim();
  try { scriptId = ScriptApp.getScriptId() || scriptId; } catch (e) {}
  var now = new Date().toISOString();

  var configRows = [
    ['SPREADSHEET_ID', spreadsheetId, 'ID Spreadsheet database utama', now],
    ['APPSCRIPT_URL', scriptUrl, 'URL Web App Google Apps Script (/exec)', now],
    ['SCRIPT_ID', scriptId, 'ID project Google Apps Script', now],
    ['DEFAULT_STUDENT_PASSWORD', '123456', 'Password default akun siswa otomatis', now],
    ['GURU_USERNAME', String(input.GURU_USERNAME || existingConfig.GURU_USERNAME || 'guru').trim(), 'Username akun guru', now],
    ['GURU_PASSWORD', String(input.GURU_PASSWORD || existingConfig.GURU_PASSWORD || '123456').trim(), 'Password akun guru', now],
    ['GURU_NAMA', String(input.GURU_NAMA || existingConfig.GURU_NAMA || 'Guru').trim(), 'Nama guru', now],
    ['GURU_KELAS', String(input.GURU_KELAS || existingConfig.GURU_KELAS || '').trim(), 'Kelas yang diampu guru', now],
    ['UPDATED_AT', now, 'Waktu terakhir konfigurasi diperbarui', now]
  ];

  var values = sheet.getDataRange().getValues();
  var keyIndex = 0;
  var rowMap = {};
  for (var i = 1; i &lt; values.length; i++) {
    var key = String(values[i][keyIndex] == null ? '' : values[i][keyIndex]).trim();
    if (key) rowMap[key] = i + 1;
  }

  configRows.forEach(function(row) {
    if (rowMap[row[0]]) {
      sheet.getRange(rowMap[row[0]], 1, 1, 4).setValues([row]);
    } else {
      sheet.appendRow(row);
    }
  });

  return { success: true, message: 'Konfigurasi aplikasi berhasil disimpan.', data: getAppConfigFromSheet() };
}

function getAppConfigFromSheet() {
  var ss = getRequestSpreadsheet_();
  var sheet = ss.getSheetByName('Config');
  if (!sheet || sheet.getLastRow() &lt; 2) {
    return {
      SPREADSHEET_ID: ss.getId(),
      APPSCRIPT_URL: '',
      SCRIPT_ID: '',
      DEFAULT_STUDENT_PASSWORD: '123456',
      UPDATED_AT: ''
    };
  }

  var values = sheet.getDataRange().getValues();
  var result = {};
  for (var i = 1; i &lt; values.length; i++) {
    var key = String(values[i][0] == null ? '' : values[i][0]).trim();
    if (key) result[key] = values[i][1];
  }
  if (!result.SPREADSHEET_ID) result.SPREADSHEET_ID = ss.getId();
  if (!result.DEFAULT_STUDENT_PASSWORD) result.DEFAULT_STUDENT_PASSWORD = '123456';
  return result;
}

function getAppConfig(key) {
  var config = getAppConfigFromSheet();
  if (key) return config[key] !== undefined ? config[key] : '';
  return config;
}

function ensureDefaultTeacherAccount() {
  var ss = getRequestSpreadsheet_();
  var sheet = ss.getSheetByName('Users');
  if (!sheet) return;
  var cfg = getAppConfigFromSheet();
  var account = {
    ID: 'USR-GURU-' + String(cfg.GURU_USERNAME || 'guru').toUpperCase(),
    Username: String(cfg.GURU_USERNAME || 'guru').trim(),
    Password: String(cfg.GURU_PASSWORD || '123456').trim(),
    Nama: String(cfg.GURU_NAMA || 'Guru').trim(),
    Role: 'guru',
    NIS: '',
    NIP: '',
    Kelas: String(cfg.GURU_KELAS || '').trim(),
    Status: 'aktif'
  };
  var headers = sheet.getRange(1,1,1,sheet.getLastColumn()).getValues()[0];
  var values = sheet.getDataRange().getValues();
  var u = headers.indexOf('Username');
  var r = headers.indexOf('Role');
  var found = -1;

  for (var i = 1; i &lt; values.length; i++) {
    var existingUsername = String(values[i][u] == null ? '' : values[i][u]).trim().toLowerCase();
    var existingRole = String(values[i][r] == null ? '' : values[i][r]).trim().toLowerCase();
    if (existingUsername === account.Username.toLowerCase() &amp;&amp; existingRole === 'guru') {
      found = i + 1;
      break;
    }
  }

  var now = new Date().toISOString();
  var row = headers.map(function(h) {
    if (h === 'CreatedAt' || h === 'UpdatedAt') return now;
    return account[h] !== undefined ? account[h] : '';
  });

  if (found &gt; 0) {
    sheet.getRange(found, 1, 1, row.length).setValues([row]);
  } else {
    sheet.appendRow(row);
  }
}

function getStudentsByClass(kelas) {
  var result=getSheetData('Siswa');

  if(!kelas) return result;
  result.data=(result.data||[]).filter(function(x){return String(x.Kelas||'').trim()===kelas;});

// Membuat / memperbarui akun login siswa berdasarkan data pada sheet Siswa.
// Aturan wajib:
//   NIS 1     -&gt; username siswa1
//   NIS 2     -&gt; username siswa2
//   password  -&gt; 123456
//   role      -&gt; siswa
function syncStudentToUser(student) {
  var ss = getRequestSpreadsheet_();
  var usersSheet = ss.getSheetByName('Users');
  if (!usersSheet || !student) return false;

  var nis = String(student.NIS == null ? '' : student.NIS).trim();
  if (!nis) return false;

  var headers = usersSheet.getRange(1, 1, 1, usersSheet.getLastColumn()).getValues()[0];
  var values = usersSheet.getDataRange().getValues();
  var nisIndex = headers.indexOf('NIS');
  var usernameIndex = headers.indexOf('Username');
  var roleIndex = headers.indexOf('Role');
  if (nisIndex === -1 || usernameIndex === -1 || roleIndex === -1) return false;

  var username = 'siswa' + nis;
  var found = -1;

  for (var i = 1; i &lt; values.length; i++) {
    var rowNis = String(values[i][nisIndex] == null ? '' : values[i][nisIndex]).trim();
    var rowRole = String(values[i][roleIndex] == null ? '' : values[i][roleIndex]).trim().toLowerCase();
    var rowUsername = String(values[i][usernameIndex] == null ? '' : values[i][usernameIndex]).trim().toLowerCase();

    // Cari berdasarkan NIS + role terlebih dahulu. Ini juga memperbaiki akun lama
    // seperti username "siswa" menjadi "siswa1001".
    if ((rowNis === nis &amp;&amp; rowRole === 'siswa') || rowUsername === username.toLowerCase()) {
      found = i + 1;
      break;
    }
  }

  var now = new Date().toISOString();
  var account = {
    ID: 'USR-SISWA-' + nis,
    Username: username,
    Password: '123456',
    Nama: student.Nama || '',
    Role: 'siswa',
    NIS: nis,
    NIP: '',
    Kelas: student.Kelas || '',
    Status: (String(student.Status || 'aktif').toLowerCase() === 'aktif') ? 'aktif' : 'nonaktif'
  };

  var row = headers.map(function(h) {
    if (h === 'CreatedAt') {
      if (found &gt; 0) {
        var createdIdx = headers.indexOf('CreatedAt');
        return createdIdx &gt;= 0 ? values[found - 1][createdIdx] : now;
      }
      return now;
    }
    if (h === 'UpdatedAt') return now;
    return account[h] !== undefined ? account[h] : '';
  });

  if (found &gt; 0) {
    usersSheet.getRange(found, 1, 1, headers.length).setValues([row]);
  } else {
    usersSheet.getRange(usersSheet.getLastRow() + 1, 1, 1, headers.length).setValues([row]);
  }
  return true;
}

function syncAllStudentUsers() {
  var students = getSheetData('Siswa').data || [];
  for (var i = 0; i &lt; students.length; i++) {
    syncStudentToUser(students[i]);
  }
}

function saveStudentAndCreateUser(student) {
  var result = addOrUpdateRow('Siswa', student, 'NIS');
  if (!result.success) return result;
  syncStudentToUser(student);
  return {
    success: true,
    message: 'Data siswa berhasil disimpan dan akun login siswa otomatis dibuat/diperbarui.',
    data: { username: 'siswa' + String(student.NIS).trim(), password: '123456', role: 'siswa' }
  };
}

function importStudentsAndCreateUsers(records) {
  var result = importRowsToSheet('Siswa', records, 'NIS');
  if (!result.success) return result;

  // Sinkronkan seluruh siswa agar data lama maupun hasil import memiliki akun.
  syncAllStudentUsers();
  result.message = 'Import siswa selesai dan akun login siswa otomatis disinkronkan.';
  result.data.accountsSynced = (getSheetData('Siswa').data || []).length;
  return result;
}

function deleteStudentAndUser(nis) {
  var result = deleteRowByKey('Siswa', 'NIS', nis);
  if (!result.success) return result;

  var ss = getRequestSpreadsheet_();
  var usersSheet = ss.getSheetByName('Users');
  if (usersSheet &amp;&amp; usersSheet.getLastRow() &gt; 1) {
    var values = usersSheet.getDataRange().getValues();
    var headers = values[0];
    var nisIndex = headers.indexOf('NIS');
    var roleIndex = headers.indexOf('Role');
    if (nisIndex &gt;= 0 &amp;&amp; roleIndex &gt;= 0) {
      for (var i = values.length - 1; i &gt;= 1; i--) {
        if (String(values[i][nisIndex]).trim() === String(nis).trim() &amp;&amp;
            String(values[i][roleIndex]).trim().toLowerCase() === 'siswa') {
          usersSheet.deleteRow(i + 1);
        }
      }
    }
  }
  return { success: true, message: 'Data siswa dan akun login siswa berhasil dihapus.', data: null };
}

function loginUser(username, password, role) {
  username = String(username == null ? '' : username).trim().toLowerCase();
  password = String(password == null ? '' : password).trim();
  role = String(role == null ? '' : role).trim().toLowerCase();

  if (!username || !password || !role) {
    return { success: false, message: 'Username, Password, dan Role wajib diisi!', data: null };
  }

  if (role !== 'guru' &amp;&amp; role !== 'siswa') {
    return { success: false, message: 'Role hanya boleh guru atau siswa!', data: null };
  }

  var users = getSheetData('Users').data || [];
  for (var i = 0; i &lt; users.length; i++) {
    var dbUsername = String(users[i].Username == null ? '' : users[i].Username).trim().toLowerCase();
    var dbPassword = String(users[i].Password == null ? '' : users[i].Password).trim();
    var dbRole = String(users[i].Role == null ? '' : users[i].Role).trim().toLowerCase();

    if (dbUsername === username &amp;&amp; dbPassword === password &amp;&amp; dbRole === role) {
      if (users[i].Status !== 'aktif') {
        return { success: false, message: 'Akun Anda sedang nonaktif.', data: null };
      }
      return {
        success: true,
        message: 'Login Berhasil',
        data: {
          ID: users[i].ID,
          Username: users[i].Username,
          Nama: users[i].Nama,
          Role: users[i].Role,
          NIS: users[i].NIS,
          NIP: users[i].NIP,
          Kelas: users[i].Kelas
        }
      };
    }
  }
  return { success: false, message: 'Username atau Password salah!', data: null };
}

// PROFIL GURU
// Data profil disimpan pada sheet Guru dan sinkron ke Users.
// Foto guru TIDAK dikirim ke server; foto hanya disimpan di localStorage browser.
// ================================================================
function getGuruProfile(body) {
  body = body || {};
  var username = String(body.username || '').trim().toLowerCase();
  var role = String(body.role || '').trim().toLowerCase();
  var spreadsheetId = String(body.spreadsheetId || body.SPREADSHEET_ID || '').trim();
  if (role !== 'guru' || !username) {
    return { success: false, message: 'Profil hanya dapat diakses oleh akun Guru.', data: null };
  }
  try {
    var ss = getSpreadsheetById_(spreadsheetId);
    var usersSheet = ss.getSheetByName('Users');
    var guruSheet = ss.getSheetByName('Guru');
    if (!usersSheet || !guruSheet) return { success:false, message:'Sheet Users atau Guru belum tersedia.', data:null };

    var users = getSheetDataFromSpreadsheet_(ss, 'Users');
    var user = users.filter(function(u) {
      return String(u.Username || '').trim().toLowerCase() === username &amp;&amp; String(u.Role || '').trim().toLowerCase() === 'guru';
    })[0];
    if (!user) return { success:false, message:'Akun Guru tidak ditemukan.', data:null };

    var nip = String(user.NIP || '').trim();
    var guruRows = getSheetDataFromSpreadsheet_(ss, 'Guru');
    var guru = null;
    if (nip) {
      guru = guruRows.filter(function(g) { return String(g.NIP || '').trim() === nip; })[0] || null;
    }
    if (!guru) {
      guru = guruRows.filter(function(g) {
        return String(g.Nama || '').trim().toLowerCase() === String(user.Nama || '').trim().toLowerCase();
      })[0] || null;
    }

    return { success:true, message:'Profil Guru berhasil dimuat.', data:{
      Username: user.Username || username,
      NIP: guru &amp;&amp; guru.NIP != null ? guru.NIP : (user.NIP || ''),
      Nama: guru &amp;&amp; guru.Nama != null &amp;&amp; String(guru.Nama).trim() ? guru.Nama : (user.Nama || ''),
      Email: guru &amp;&amp; guru.Email != null ? guru.Email : '',
      NoHP: guru &amp;&amp; guru.NoHP != null ? guru.NoHP : '',
      MapelUtama: guru &amp;&amp; guru.MapelUtama != null ? guru.MapelUtama : '',
      Kelas: user.Kelas || ''
    }};
  } catch (e) {
    return { success:false, message:'Gagal memuat profil Guru: ' + e.message, data:null };
  }
}

function setConfigValueInSpreadsheet_(ss, key, value, description) {
  var sheet = ss.getSheetByName('Config');
  if (!sheet) return;
  var now = new Date().toISOString();
  var values = sheet.getDataRange().getValues();
  var found = -1;
  for (var i = 1; i &lt; values.length; i++) {
    if (String(values[i][0] || '').trim() === key) { found = i + 1; break; }
  }
  var row = [key, value, description || '', now];
  if (found &gt; 0) sheet.getRange(found, 1, 1, 4).setValues([row]);
  else sheet.appendRow(row);
}

function saveGuruProfile(body) {
  body = body || {};
  var username = String(body.username || '').trim().toLowerCase();
  var role = String(body.role || '').trim().toLowerCase();
  var spreadsheetId = String(body.spreadsheetId || body.SPREADSHEET_ID || '').trim();
  if (role !== 'guru' || !username) return { success:false, message:'Hanya akun Guru yang dapat mengubah profil.', data:null };

  var nama = String(body.Nama || '').trim();
  var nip = String(body.NIP || '').trim();
  var email = String(body.Email || '').trim();
  var noHp = String(body.NoHP || '').trim();
  var mapelUtama = String(body.MapelUtama || '').trim();
  var kelas = String(body.Kelas || '').trim();
  if (!nama) return { success:false, message:'Nama Guru wajib diisi.', data:null };

  try {
    var ss = getSpreadsheetById_(spreadsheetId);
    ensureDatabaseSheetsForSpreadsheet_(ss);

    var usersSheet = ss.getSheetByName('Users');
    var guruSheet = ss.getSheetByName('Guru');
    var userValues = usersSheet.getDataRange().getValues();
    var userHeaders = userValues[0];
    var usernameIndex = userHeaders.indexOf('Username');
    var roleIndex = userHeaders.indexOf('Role');
    var foundUserRow = -1;
    var oldNip = '';
    for (var i = 1; i &lt; userValues.length; i++) {
      if (String(userValues[i][usernameIndex] || '').trim().toLowerCase() === username &amp;&amp; String(userValues[i][roleIndex] || '').trim().toLowerCase() === 'guru') {
        foundUserRow = i + 1;
        var oldNipIndex = userHeaders.indexOf('NIP');
        oldNip = oldNipIndex &gt;= 0 ? String(userValues[i][oldNipIndex] || '').trim() : '';
        break;
      }
    }
    if (foundUserRow &lt; 0) return { success:false, message:'Akun Guru tidak ditemukan di sheet Users.', data:null };

    var now = new Date().toISOString();
    var updatedUser = userValues[foundUserRow - 1].slice();
    function putUser(field, value) {
      var idx = userHeaders.indexOf(field);
      if (idx &gt;= 0) updatedUser[idx] = value;
    }
    putUser('Nama', nama);
    putUser('NIP', nip);
    putUser('Kelas', kelas);
    putUser('UpdatedAt', now);
    usersSheet.getRange(foundUserRow, 1, 1, userHeaders.length).setValues([updatedUser]);

    var guruValues = guruSheet.getDataRange().getValues();
    var guruHeaders = guruValues[0];
    var guruNipIndex = guruHeaders.indexOf('NIP');
    var guruNameIndex = guruHeaders.indexOf('Nama');
    var foundGuruRow = -1;
    for (var j = 1; j &lt; guruValues.length; j++) {
      var rowNip = guruNipIndex &gt;= 0 ? String(guruValues[j][guruNipIndex] || '').trim() : '';
      var rowName = guruNameIndex &gt;= 0 ? String(guruValues[j][guruNameIndex] || '').trim().toLowerCase() : '';
      if ((nip &amp;&amp; rowNip &amp;&amp; rowNip === nip) || (oldNip &amp;&amp; rowNip === oldNip) || (!oldNip &amp;&amp; rowName === String(body.oldNama || '').trim().toLowerCase())) {
        foundGuruRow = j + 1;
        break;
      }
    }

    var guruRecord = {NIP:nip, Nama:nama, Email:email, NoHP:noHp, MapelUtama:mapelUtama};
    var guruRow = guruHeaders.map(function(h) { return guruRecord[h] !== undefined ? guruRecord[h] : ''; });
    if (foundGuruRow &gt; 0) guruSheet.getRange(foundGuruRow, 1, 1, guruHeaders.length).setValues([guruRow]);
    else guruSheet.appendRow(guruRow);

    // Sinkronkan nama/kelas pada Config agar setup berikutnya tidak mengembalikan profil lama.
    setConfigValueInSpreadsheet_(ss, 'GURU_NAMA', nama, 'Nama guru');
    setConfigValueInSpreadsheet_(ss, 'GURU_KELAS', kelas, 'Kelas yang diampu guru');

    return { success:true, message:'Profil Guru berhasil diperbarui dan disimpan ke sheet Guru.', data:{Username:username, NIP:nip, Nama:nama, Email:email, NoHP:noHp, MapelUtama:mapelUtama, Kelas:kelas} };
  } catch (e) {
    return { success:false, message:'Gagal menyimpan profil Guru: ' + e.message, data:null };
  }
}

function isActiveGuru_(body) {
  body = body || {};
  var username = String(body.username || '').trim().toLowerCase();
  var role = String(body.role || '').trim().toLowerCase();
  if (role !== 'guru' || !username) return false;
  var users = getSheetData('Users').data || [];
  return users.some(function(u) {
    return String(u.Username || '').trim().toLowerCase() === username &amp;&amp;
           String(u.Role || '').trim().toLowerCase() === 'guru' &amp;&amp;
           String(u.Status || '').trim().toLowerCase() === 'aktif';
  });
}

function normalizeMenuType_(value) {
  return String(value || 'file').trim().toLowerCase() === 'link' ? 'link' : 'file';
}

function normalizeMenuTargetTab_(value) {
  return String(value || 'same').trim().toLowerCase() === 'blank' ? 'blank' : 'same';
}

function normalizeMenuStatus_(value) {
  return String(value || 'aktif').trim().toLowerCase() === 'nonaktif' ? 'nonaktif' : 'aktif';
}

function validateMenuTarget_(type, target) {
  type = normalizeMenuType_(type);
  target = String(target || '').trim();
  if (!target) return 'Target file/link wajib diisi.';
  if (/^\s*(javascript|data|vbscript):/i.test(target)) return 'Target tidak aman. Gunakan file lokal, http:// atau https://.';
  if (type === 'link' &amp;&amp; !/^https?:\/\//i.test(target)) return 'Untuk tipe Link, URL harus diawali http:// atau https://.';
  return '';
}

function getMenuGuru(body) {
  body = body || {};
  var ss = getSpreadsheetById_(String(body.spreadsheetId || body.SPREADSHEET_ID || '').trim());
  ensureDatabaseSheetsForSpreadsheet_(ss);
  var rows = getSheetDataFromSpreadsheet_(ss, 'MenuGuru').map(function(m) {
    return {
      ID: String(m.ID || ''),
      NamaMenu: String(m.NamaMenu || ''),
      Ikon: String(m.Ikon || 'fa-solid fa-link'),
      Tipe: normalizeMenuType_(m.Tipe),
      Target: String(m.Target || ''),
      TargetTab: normalizeMenuTargetTab_(m.TargetTab),
      Urutan: Number(m.Urutan || 0),
      Status: normalizeMenuStatus_(m.Status),
      CreatedAt: m.CreatedAt || '',
      UpdatedAt: m.UpdatedAt || ''
    };
  });
  rows.sort(function(a,b) {
    var ua = Number(a.Urutan || 0), ub = Number(b.Urutan || 0);
    if (ua !== ub) return ua - ub;
    return a.NamaMenu.localeCompare(b.NamaMenu, 'id');
  });
  var includeInactive = String(body.includeInactive || '').toLowerCase() === 'true' || body.includeInactive === true;
  if (!includeInactive) rows = rows.filter(function(m) { return m.Status === 'aktif'; });
  return {success:true, message:'Menu Guru berhasil dimuat.', data:rows};
}

function saveMenuGuru(body) {
  body = body || {};
  if (!isActiveGuru_(body)) return {success:false, message:'Hanya Guru aktif yang dapat mengatur Menu Utama.', data:null};
  var ss = getSpreadsheetById_(String(body.spreadsheetId || body.SPREADSHEET_ID || '').trim());
  ensureDatabaseSheetsForSpreadsheet_(ss);
  var sheet = ss.getSheetByName('MenuGuru');
  var nama = String(body.NamaMenu || '').trim();
  var ikon = String(body.Ikon || 'fa-solid fa-link').trim() || 'fa-solid fa-link';
  var tipe = normalizeMenuType_(body.Tipe);
  var target = String(body.Target || '').trim();
  var targetTab = normalizeMenuTargetTab_(body.TargetTab);
  var status = normalizeMenuStatus_(body.Status);
  var id = String(body.ID || '').trim();

  if (!nama) return {success:false, message:'Nama Menu wajib diisi.', data:null};
  if (nama.length &gt; 50) return {success:false, message:'Nama Menu maksimal 50 karakter.', data:null};
  var targetError = validateMenuTarget_(tipe, target);
  if (targetError) return {success:false, message:targetError, data:null};

  var values = sheet.getDataRange().getValues();
  var headers = values[0];
  var idIndex = headers.indexOf('ID');
  var orderIndex = headers.indexOf('Urutan');
  var createdIndex = headers.indexOf('CreatedAt');
  var foundRow = -1;
  var existingCreatedAt = '';
  for (var i=1; i&lt;values.length; i++) {
    if (id &amp;&amp; String(values[i][idIndex] || '').trim() === id) {
      foundRow = i + 1;
      existingCreatedAt = createdIndex &gt;= 0 ? values[i][createdIndex] : '';
      break;
    }
  }
  if (!id) id = 'MNU-' + Date.now() + '-' + Math.floor(Math.random()*1000);

  var urutan = Number(body.Urutan);
  if (!isFinite(urutan) || urutan &lt;= 0) {
    var maxOrder = 0;
    for (var j=1; j&lt;values.length; j++) maxOrder = Math.max(maxOrder, Number(values[j][orderIndex] || 0));
    urutan = maxOrder + 1;
  }

  var now = new Date().toISOString();
  var record = {
    ID:id, NamaMenu:nama, Ikon:ikon, Tipe:tipe, Target:target,
    TargetTab:targetTab, Urutan:urutan, Status:status,
    CreatedAt:existingCreatedAt || now, UpdatedAt:now
  };
  var row = headers.map(function(h){ return record[h] !== undefined ? record[h] : ''; });
  if (foundRow &gt; 0) sheet.getRange(foundRow,1,1,headers.length).setValues([row]);
  else sheet.appendRow(row);
  return {success:true, message:foundRow &gt; 0 ? 'Menu berhasil diperbarui.' : 'Menu berhasil ditambahkan.', data:record};
}

function deleteMenuGuru(body) {
  body = body || {};
  if (!isActiveGuru_(body)) return {success:false, message:'Hanya Guru aktif yang dapat menghapus Menu Utama.', data:null};
  var ss = getSpreadsheetById_(String(body.spreadsheetId || body.SPREADSHEET_ID || '').trim());
  ensureDatabaseSheetsForSpreadsheet_(ss);
  var id = String(body.ID || '').trim();
  if (!id) return {success:false, message:'ID menu tidak ditemukan.', data:null};
  var sheet = ss.getSheetByName('MenuGuru');
  var values = sheet.getDataRange().getValues();
  var headers = values[0], idx = headers.indexOf('ID');
  for (var i=1; i&lt;values.length; i++) {
    if (String(values[i][idx] || '').trim() === id) {
      sheet.deleteRow(i+1);
      return {success:true, message:'Menu berhasil dihapus.', data:null};
    }
  }
  return {success:false, message:'Menu tidak ditemukan.', data:null};
}

function reorderMenuGuru(body) {
  body = body || {};
  if (!isActiveGuru_(body)) return {success:false, message:'Hanya Guru aktif yang dapat mengatur urutan menu.', data:null};
  var ss = getSpreadsheetById_(String(body.spreadsheetId || body.SPREADSHEET_ID || '').trim());
  ensureDatabaseSheetsForSpreadsheet_(ss);
  var ids = body.ids || body.order || [];
  if (typeof ids === 'string') {
    try { ids = JSON.parse(ids); } catch(e) { ids = ids.split(','); }
  }
  if (!Array.isArray(ids) || !ids.length) return {success:false, message:'Urutan menu tidak valid.', data:null};

  var sheet = ss.getSheetByName('MenuGuru');
  var values = sheet.getDataRange().getValues(), headers = values[0];
  var idIdx = headers.indexOf('ID'), orderIdx = headers.indexOf('Urutan'), updatedIdx = headers.indexOf('UpdatedAt');
  var rowMap = {};
  for (var i=1; i&lt;values.length; i++) rowMap[String(values[i][idIdx] || '').trim()] = i+1;
  var now = new Date().toISOString(), updated = 0;
  ids.forEach(function(id, index) {
    id = String(id || '').trim();
    if (rowMap[id]) {
      sheet.getRange(rowMap[id], orderIdx+1).setValue(index+1);
      if (updatedIdx &gt;= 0) sheet.getRange(rowMap[id], updatedIdx+1).setValue(now);
      updated++;
    }
  });
  return {success:true, message:'Urutan Menu Utama berhasil disimpan.', data:{updated:updated}};
}

function ensureDatabaseSheetsForSpreadsheet_(ss) {
  var schemas = getDatabaseSchemas();
  Object.keys(schemas).forEach(function(sheetName) {
    var headers = schemas[sheetName];
    var sheet = ss.getSheetByName(sheetName);
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
      sheet.getRange(1, 1, 1, headers.length).setFontWeight('bold').setBackground('#e2e8f0');
      sheet.setFrozenRows(1);
    }
  });
}

function getQuizPageUrl() {
  return ScriptApp.getService().getUrl() + '?page=kuis';
}

function googleRpc(action, params, body) {
  params = params || {};
  body = body || {};
  var output = handleRequest(action, params, body);
  try {
    return JSON.parse(output.getContent());
  } catch (e) {
    return { success: false, message: String(e), data: null };
  }
}

function getSpreadsheetById_(spreadsheetId) {
  var id = String(spreadsheetId == null ? '' : spreadsheetId).trim();
  if (!id) return getRequestSpreadsheet_();
  return SpreadsheetApp.openById(id);
}

function getSheetDataFromSpreadsheet_(ss, sheetName) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return [];
  var values = sheet.getDataRange().getValues();
  if (values.length &lt;= 1) return [];
  var headers = values[0];
  return values.slice(1).map(function(row) {
    var obj = {};
    headers.forEach(function(h, i) { obj[h] = row[i]; });
    return obj;
  });
}

function getConfigFromSpreadsheet_(ss) {
  var sheet = ss.getSheetByName('Config');
  var result = {};
  if (!sheet || sheet.getLastRow() &lt; 2) return result;
  var values = sheet.getDataRange().getValues();
  for (var i = 1; i &lt; values.length; i++) {
    var key = String(values[i][0] == null ? '' : values[i][0]).trim();
    if (key) result[key] = values[i][1];
  }
  return result;
}

function loginUserBySpreadsheetId(spreadsheetId, username, password, role) {
  username = String(username == null ? '' : username).trim().toLowerCase();
  password = String(password == null ? '' : password).trim();
  role = String(role == null ? '' : role).trim().toLowerCase();
  spreadsheetId = String(spreadsheetId == null ? '' : spreadsheetId).trim();
  if (!spreadsheetId || !username || !password || !role) {
    return { success: false, message: 'Kode database, Username, Password, dan Role wajib diisi!', data: null };
  }
  if (role !== 'guru' &amp;&amp; role !== 'siswa') {

function getSheetData(sheetName) {
  var ss = getRequestSpreadsheet_();
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return { success: true, message: 'Sheet tidak ditemukan', data: [] };
  
  var values = sheet.getDataRange().getValues();
  if (values.length &lt;= 1) return { success: true, message: 'Data kosong', data: [] };
  
  var headers = values[0];
  var list = [];
  for (var i = 1; i &lt; values.length; i++) {
    var row = values[i];
    var obj = {};
    for (var j = 0; j &lt; headers.length; j++) {
      obj[headers[j]] = row[j];
    }
    list.push(obj);
  }
  return { success: true, message: 'OK', data: list };
}

function addOrUpdateRow(sheetName, dataObj, keyField) {
  var ss = getRequestSpreadsheet_();
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return { success: false, message: 'Sheet tidak ditemukan' };
  
  var values = sheet.getDataRange().getValues();
  var headers = values[0];
  var keyVal = dataObj[keyField];
  var rowIndex = -1;
  
  for (var i = 1; i &lt; values.length; i++) {
    var rowKey = values[i][headers.indexOf(keyField)];
    if (rowKey == keyVal) {
      rowIndex = i + 1;
      break;
    }
  }
  
  var rowData = headers.map(function(h) { return dataObj[h] !== undefined ? dataObj[h] : ''; });
  
  if (rowIndex &gt; 0) {
    sheet.getRange(rowIndex, 1, 1, rowData.length).setValues([rowData]);
  } else {
    sheet.appendRow(rowData);
  }
  return { success: true, message: 'Data berhasil disimpan', data: null };
}

function appendMultipleRows(sheetName, records) {
  var ss = getRequestSpreadsheet_();
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet || !records || records.length === 0) return { success: false, message: 'Gagal simpan data batch' };

  var headers = sheet.getDataRange().getValues()[0];
  var rows = records.map(function(dataObj) {
    return headers.map(function(h) { return dataObj[h] !== undefined ? dataObj[h] : ''; });
  });
  sheet.getRange(sheet.getLastRow() + 1, 1, rows.length, headers.length).setValues(rows);
  return { success: true, message: 'Data absensi berhasil disimpan', data: { inserted: rows.length } };
}

// Import Excel: validasi header, normalisasi data, update berdasarkan key, dan batch insert.
function importRowsToSheet(sheetName, records, keyField) {
  var ss = getRequestSpreadsheet_();
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return { success: false, message: 'Sheet ' + sheetName + ' tidak ditemukan.', data: null };
  if (!Array.isArray(records) || records.length === 0) {
    return { success: false, message: 'Tidak ada data untuk diimport.', data: null };
  }

  var range = sheet.getDataRange();
  var values = range.getValues();
  var headers = values.length ? values[0].map(String) : [];
  var keyIndex = headers.indexOf(keyField);
  if (keyIndex === -1) return { success: false, message: 'Kolom kunci ' + keyField + ' tidak ditemukan.', data: null };

  var existing = {};
  for (var i = 1; i &lt; values.length; i++) {
    var k = String(values[i][keyIndex] == null ? '' : values[i][keyIndex]).trim();
    if (k) existing[k] = i + 1;
  }

  var inserted = 0, updated = 0, skipped = 0;
  var appendRows = [];
  records.forEach(function(obj) {
    var key = String(obj[keyField] == null ? '' : obj[keyField]).trim();
    if (!key) { skipped++; return; }
    var row = headers.map(function(h) { return obj[h] !== undefined &amp;&amp; obj[h] !== null ? obj[h] : ''; });
    if (existing[key]) {
      sheet.getRange(existing[key], 1, 1, headers.length).setValues([row]);
      updated++;
    } else {
      appendRows.push(row);
      existing[key] = -1;
      inserted++;
    }
  });
  if (appendRows.length) {
    sheet.getRange(sheet.getLastRow() + 1, 1, appendRows.length, headers.length).setValues(appendRows);
  }
  return { success: true, message: 'Import ' + sheetName + ' selesai.', data: { inserted: inserted, updated: updated, skipped: skipped, total: records.length } };
}

function deleteRowByKey(sheetName, keyField, keyValue) {
  var ss = getRequestSpreadsheet_();
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return { success: false, message: 'Sheet tidak ditemukan' };
  
  var values = sheet.getDataRange().getValues();
  var headers = values[0];
  var colIndex = headers.indexOf(keyField);
  
  for (var i = 1; i &lt; values.length; i++) {
    if (values[i][colIndex] == keyValue) {
      sheet.deleteRow(i + 1);
      return { success: true, message: 'Data berhasil dihapus', data: null };
    }
  }
  return { success: false, message: 'Data tidak ditemukan', data: null };
}

// HALO-HALO AI GURU
// Arsitektur hemat biaya: browser melakukan Speech-to-Text, backend
// hanya mengirim teks ke OpenAI Responses API. Audio tidak dikirim.
// API key disimpan di Script Properties, bukan di HTML.
// =================================================================
var HALO_AI_MODEL = 'gpt-5.6-luna';
var HALO_AI_DAILY_LIMIT = 20;

function getHaloTodayKey_(username) {
  var tz = Session.getScriptTimeZone() || 'Asia/Jakarta';
  return 'HALO_QUOTA_' + Utilities.formatDate(new Date(), tz, 'yyyyMMdd') + '_' + String(username || '').toLowerCase();
}

function getOpenAiApiKey_() {
  return String(PropertiesService.getScriptProperties().getProperty('OPENAI_API_KEY') || '').trim();
}

function getOpenAiStatus(body) {
  body = body || {};
  var username = String(body.username || '').trim();
  var key = PropertiesService.getScriptProperties().getProperty('OPENAI_API_KEY');
  var props = PropertiesService.getScriptProperties();
  var used = Number(props.getProperty(getHaloTodayKey_(username)) || 0);
  return { success: true, message: 'OK', data: { configured: !!key, model: HALO_AI_MODEL, used: used, limit: HALO_AI_DAILY_LIMIT } };
}

function saveOpenAiApiKey(body) {
  body = body || {};
  var key = String(body.apiKey || '').trim();
  if (!key) return { success: false, message: 'API Key OpenAI wajib diisi.', data: null };
  PropertiesService.getScriptProperties().setProperty('OPENAI_API_KEY', key);
  return { success: true, message: 'API Key OpenAI tersimpan aman di Script Properties.', data: { configured: true, model: HALO_AI_MODEL } };
}

function validateGuruForAI_(username) {
  username = String(username || '').trim().toLowerCase();
  if (!username) return false;
  var users = getSheetData('Users').data || [];
  return users.some(function(u) {
    return String(u.Username || '').trim().toLowerCase() === username &amp;&amp; String(u.Role || '').trim().toLowerCase() === 'guru' &amp;&amp; String(u.Status || '').trim().toLowerCase() === 'aktif';
  });
}

function consumeHaloQuota_(username) {
  var props = PropertiesService.getScriptProperties();
  var key = getHaloTodayKey_(username);
  var used = Number(props.getProperty(key) || 0);
  if (used &gt;= HALO_AI_DAILY_LIMIT) return false;
  props.setProperty(key, String(used + 1));
  return true;
}

function buildHaloContext_() {
  var students = getSheetData('Siswa').data || [];
  var subjects = getSheetData('MasterMapel').data || [];
  return {
    students: students.slice(0, 300).map(function(s) { return { NIS: String(s.NIS || ''), Nama: String(s.Nama || ''), Kelas: String(s.Kelas || '') }; }),
    subjects: subjects.slice(0, 200).map(function(m) { return { Kode: String(m.Kode || ''), NamaMapel: String(m.NamaMapel || ''), Kelas: String(m.Kelas || ''), Status: String(m.Status || '') }; })
  };
}

function parseOpenAiText_(json) {
  if (json &amp;&amp; json.output_text) return String(json.output_text);
  var out = json &amp;&amp; json.output ? json.output : [];
  var parts = [];
  out.forEach(function(item) {
    (item.content || []).forEach(function(c) {
      if (c.text) parts.push(c.text);
    });
  });
  return parts.join('\n').trim();
}

function extractJsonObject_(text) {
  text = String(text || '').trim();
  try { return JSON.parse(text); } catch (e) {}
  var match = text.match(/\{[\s\S]*\}/);
  if (!match) throw new Error('Respons AI bukan JSON yang valid.');
  return JSON.parse(match[0]);
}

function callHaloOpenAI_(instruction, context) {
  var apiKey = getOpenAiApiKey_();
  if (!apiKey) throw new Error('API Key OpenAI belum diatur. Buka Asisten AI Guru lalu simpan API Key.');
  var system = [
    'Anda adalah Halo-Halo, asisten operasional LMS sekolah untuk guru Indonesia.',
    'Balas HANYA JSON valid tanpa markdown.',
    'Format: {"action":"none|open_view|search_student|input_grade","reply":"...","view":"","student":{"NIS":"","Nama":"","Kelas":""},"intent":{"NIS":"","NamaSiswa":"","KodeMapel":"","NamaMapel":"","Kelas":"","JenisPenilaian":"","Nilai":0}}',
    'Jangan pernah mengarang NIS, nama siswa, kode mapel, atau nilai. Gunakan data konteks yang diberikan.',
    'Untuk navigasi guru gunakan view: dashboard, data-siswa, master-mapel, absensi, penilaian, hasil-belajar, jurnal, pengumuman, asisten-ai.',
    'Untuk input nilai: NIS dan Nilai wajib. Jika jenis penilaian belum jelas, tanyakan. Jika mapel belum jelas, tanyakan; jangan menebak.',
    'Nilai harus angka 0 sampai 100. Pahami angka Bahasa Indonesia seperti delapan puluh=80, sembilan puluh lima=95, seratus=100.',
    'Jika pengguna mengucapkan "absen 1" sebagai jenis penilaian, pertahankan sebagai "Absen 1".',
    'Jawaban reply singkat dan natural dalam Bahasa Indonesia.'
  ].join('\n');
  var payload = {
    model: HALO_AI_MODEL,
    input: system + '\n\nKONTEKS DATA:\n' + JSON.stringify(context) + '\n\nPERINTAH GURU:\n' + instruction,
    max_output_tokens: 500
  };
  var response = UrlFetchApp.fetch('https://api.openai.com/v1/responses', {
    method: 'post',
    contentType: 'application/json',
    headers: { Authorization: 'Bearer ' + apiKey },
    payload: JSON.stringify(payload),
    muteHttpExceptions: true
  });
  var code = response.getResponseCode();
  var text = response.getContentText();
  if (code &lt; 200 || code &gt;= 300) throw new Error('OpenAI API error ' + code + ': ' + text.substring(0, 500));
  return extractJsonObject_(parseOpenAiText_(JSON.parse(text)));
}

function haloHalo(body) {
  body = body || {};
  var username = String(body.username || '').trim();
  var role = String(body.role || '').trim().toLowerCase();
  var text = String(body.text || '').trim();
  if (role !== 'guru' || !validateGuruForAI_(username)) return { success: false, message: 'Asisten Halo-Halo hanya dapat digunakan oleh akun Guru aktif.', data: null };
  if (!text) return { success: false, message: 'Perintah kosong.', data: null };
  if (!consumeHaloQuota_(username)) return { success: false, message: 'Kuota Halo-Halo hari ini sudah habis. Batas harian: ' + HALO_AI_DAILY_LIMIT + ' permintaan.', data: null };
  try {
    var ai = callHaloOpenAI_(text, buildHaloContext_());
    if (ai.action === 'search_student' &amp;&amp; ai.student &amp;&amp; ai.student.NIS) {
      var students = getSheetData('Siswa').data || [];
      var found = students.filter(function(s) { return String(s.NIS || '').trim() === String(ai.student.NIS).trim(); })[0];
      if (found) ai.student = { NIS: found.NIS, Nama: found.Nama, Kelas: found.Kelas };
    }
    if (ai.action === 'input_grade' &amp;&amp; ai.intent) {
      var intent = ai.intent;
      var studentRows = getSheetData('Siswa').data || [];
      var student = studentRows.filter(function(s) { return String(s.NIS || '').trim() === String(intent.NIS || '').trim(); })[0];
      if (!student) { ai.action = 'none'; ai.reply = 'NIS tersebut tidak ditemukan di Data Siswa. Silakan periksa kembali NIS.'; }
      else {
        intent.NIS = String(student.NIS);
        intent.NamaSiswa = student.Nama;
        intent.Kelas = intent.Kelas || student.Kelas;
        var grade = Number(intent.Nilai);
        if (!isFinite(grade) || grade &lt; 0 || grade &gt; 100) { ai.action='none'; ai.reply='Nilai harus berupa angka antara 0 sampai 100.'; }
        else {
          var maps = getSheetData('MasterMapel').data || [];
          if (!intent.KodeMapel &amp;&amp; intent.NamaMapel) {
            var foundMapel = maps.filter(function(m) { return String(m.NamaMapel || '').trim().toLowerCase() === String(intent.NamaMapel).trim().toLowerCase() &amp;&amp; String(m.Status || 'aktif').toLowerCase() !== 'nonaktif'; })[0];
            if (foundMapel) { intent.KodeMapel = foundMapel.Kode; intent.NamaMapel = foundMapel.NamaMapel; }
          }
          if (!intent.KodeMapel) {
            ai.action = 'none';
            ai.reply = 'Mapel belum disebutkan. Silakan sebutkan nama atau kode mapelnya terlebih dahulu.';
          } else {
            var validMapel = maps.filter(function(m) { return String(m.Kode || '').trim().toLowerCase() === String(intent.KodeMapel).trim().toLowerCase() &amp;&amp; String(m.Status || 'aktif').toLowerCase() !== 'nonaktif'; })[0];
            if (!validMapel) { ai.action='none'; ai.reply='Kode atau nama mapel tersebut tidak ditemukan di Master Mapel.'; }
            else { intent.KodeMapel = validMapel.Kode; intent.NamaMapel = validMapel.NamaMapel; intent.Nilai = grade; }
          }
        }
      }
      ai.intent = intent;
    }
    return { success: true, message: 'OK', data: ai };
  } catch (e) {
    return { success: false, message: e.message || String(e), data: null };
  }
}

function haloHaloConfirm(body) {
  body = body || {};
  var username = String(body.username || '').trim();
  var role = String(body.role || '').trim().toLowerCase();
  var intent = body.intent || {};
  if (role !== 'guru' || !validateGuruForAI_(username)) return { success:false, message:'Konfirmasi hanya dapat dilakukan oleh Guru aktif.', data:null };
  var nis = String(intent.NIS || '').trim();

  var students = getSheetData('Siswa').data || [];

  if (!student) return { success:false, message:'Siswa dengan NIS ' + nis + ' tidak ditemukan.', data:null };
  var subjects = getSheetData('MasterMapel').data || [];
  var subject = subjects.filter(function(m){ return String(m.Kode || '').trim().toLowerCase() === kode.toLowerCase() &amp;&amp; String(m.Status || 'aktif').toLowerCase() !== 'nonaktif'; })[0];
  if (!subject) return {success:false, message:'Mapel ' + kode + ' tidak ditemukan atau nonaktif.', data:null};
  var payload = { ID:'NIL-AI-' + Date.now(), Kelas: student.Kelas || intent.Kelas || '', KodeMapel: subject.Kode, NIS: student.NIS, NamaSiswa: student.Nama, JenisPenilaian: jenis, Nilai: nilai, Tanggal: Utilities.formatDate(new Date(), Session.getScriptTimeZone() || 'Asia/Jakarta', 'yyyy-MM-dd') };
  var result = addOrUpdateRow('Nilai', payload, 'ID');
  if (result.success) result.message = 'Nilai berhasil disimpan: ' + student.Nama + ' (' + nis + ') = ' + nilai + ' untuk ' + jenis + ' pada ' + subject.NamaMapel + '.';
  return result;
}

function clearAllData() {
  var ss = getRequestSpreadsheet_();
  var sheets = ss.getSheets();
  for (var i = 0; i &lt; sheets.length; i++) {
    var sheet = sheets[i];

    // ==========================================
    // API SERVICE ADAPTER (GAS OR OFFLINE)
    // ==========================================
    async function apiCall(action, params = {}, body = null) {
      // GitHub Pages mode: selalu gunakan HTTPS fetch ke Apps Script API.
      // Tidak menggunakan google.script.run karena GitHub Pages bukan HTML Service Apps Script.
      if (config.mode !== 'online' || !config.scriptUrl) {
        return handleMockApi(action, params, body);
      }
      showLoading(true);
      try {
        const url = new URL(config.scriptUrl);
        const payload = Object.assign({}, params || {}, body || {}, { action });
        if (config.spreadsheetId && payload.spreadsheetId === undefined) payload.spreadsheetId = config.spreadsheetId;

        let response;
        if (body || Object.keys(params || {}).length) {
          // application/x-www-form-urlencoded adalah CORS simple request sehingga tidak memicu OPTIONS preflight.
          const form = new URLSearchParams();
          Object.keys(payload).forEach(k => {
            const v = payload[k];
            form.append(k, typeof v === 'object' ? JSON.stringify(v) : String(v == null ? '' : v));
          });
          response = await fetch(url.toString(), {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: form.toString(),
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store'
          });
        } else {
          Object.keys(payload).forEach(k => url.searchParams.set(k, payload[k]));
          response = await fetch(url.toString(), { method:'GET', mode:'cors', credentials:'omit', cache:'no-store' });
        }
        const text = await response.text();
        let json;
        try { json = JSON.parse(text); }
        catch (parseErr) { throw new Error('Respons API bukan JSON. HTTP ' + response.status + ': ' + text.slice(0, 180)); }
        showLoading(false);
        if (!response.ok) json.success = false;
        return json;
      } catch (err) {
        showLoading(false);
        const msg = err && err.message ? err.message : String(err);
        showToast('Gagal menghubungi Google Apps Script API: ' + msg, 'error');
        return { success:false, message:msg, data:null };
      }
    }

    function handleMockApi(action, params, body) {
      return new Promise((resolve) => {
        setTimeout(() => {
          if (action === 'testConnection') {
            resolve({ success: true, message: 'MODE OFFLINE: Simulasi Koneksi Sukses', data: { title: 'Spreadsheet Demo' } });
          } else if (action === 'setupDatabase') {
            resolve({ success: true, message: 'MODE OFFLINE: Database Siap Digunakan', data: null });
          } else if (action === 'saveAppConfig') {
            resolve({ success: true, message: 'MODE OFFLINE: Config tersimpan', data: body || null });
          } else if (action === 'getAppConfig') {
            resolve({ success: true, message: 'MODE OFFLINE: Config tersedia', data: {SPREADSHEET_ID: config.spreadsheetId || '', APPSCRIPT_URL: config.scriptUrl || '', SCRIPT_ID: '', DEFAULT_STUDENT_PASSWORD: '123456'} });
          } else if (action === 'login') {
            const offlinePasswordOk = String(body.password || '') === '11223344';
            const offlineUsernameOk = String(body.username || '').trim().toLowerCase() === 'guru';
            if (body.role === 'guru' && offlineUsernameOk && offlinePasswordOk) {
              resolve({ success: true, message: 'Login Offline Guru berhasil.', data: { ID: 'OFFLINE-GURU', Username: 'guru', Nama: 'Guru Offline', Role: 'guru', NIP: '', Kelas: '' } });
            } else {
              resolve({ success: false, message: 'Mode Offline hanya dapat login sebagai Guru dengan username guru dan password 11223344.', data: null });
            }
          } else if (action === 'getGuruProfile') {
            const saved = JSON.parse(localStorage.getItem('edusmart_demo_guru_profile') || 'null');
            resolve({ success:true, message:'Profil Guru demo dimuat.', data: saved || { Username: body.username || 'guru', NIP:'19850101', Nama:'Budi Santoso, S.Pd', Email:'', NoHP:'', MapelUtama:'Matematika', Kelas:'VII-A' } });
          } else if (action === 'saveGuruProfile') {
            const profile = Object.assign({}, body);
            localStorage.setItem('edusmart_demo_guru_profile', JSON.stringify(profile));
            resolve({ success:true, message:'Profil Guru berhasil disimpan (Mode Offline).', data: profile });
          } else if (action === 'getStudents') { const k=(body&&body.kelas)||params.kelas||''; const students=JSON.parse(localStorage.getItem('edusmart_offline_students') || JSON.stringify(MOCK_DATA.Siswa || [])); resolve({ success:true, data:k ? students.filter(x=>String(x.Kelas||'')===String(k)) : students }); }
          else if (action === 'getSubjects') resolve({ success: true, data: MOCK_DATA.MasterMapel });
          else if (action === 'getAttendance') resolve({ success: true, data: MOCK_DATA.Absensi });
          else if (action === 'getGrades') resolve({ success: true, data: MOCK_DATA.Nilai });
          else if (action === 'getJournals') resolve({ success: true, data: MOCK_DATA.Jurnal });
          else if (action === 'getQuizzes') resolve({ success: true, data: MOCK_DATA.Kuis });
          else if (action === 'getQuizQuestions') resolve({ success: true, data: MOCK_DATA.SoalKuis });
          else if (action === 'getAnnouncements') resolve({ success: true, data: MOCK_DATA.Pengumuman });
          else if (action === 'saveStudent') {
            const students = JSON.parse(localStorage.getItem('edusmart_offline_students') || JSON.stringify(MOCK_DATA.Siswa || []));
            const incoming = Object.assign({}, body);
            const idx = students.findIndex(x => String(x.NIS) === String(incoming.NIS));
            if (idx >= 0) students[idx] = incoming; else students.push(incoming);
            localStorage.setItem('edusmart_offline_students', JSON.stringify(students));
            resolve({ success:true, message:'Data siswa tersimpan di perangkat (Mode Offline). Tidak dikirim ke Spreadsheet.', data:null });
          } else if (action === 'getStudents') { const k=(body&&body.kelas)||params.kelas||''; const students=JSON.parse(localStorage.getItem('edusmart_offline_students') || JSON.stringify(MOCK_DATA.Siswa || [])); resolve({ success:true, data:k ? students.filter(x=>String(x.Kelas||'')===String(k)) : students }); }
          else if (action === 'deleteStudent') {
            const students = JSON.parse(localStorage.getItem('edusmart_offline_students') || JSON.stringify(MOCK_DATA.Siswa || []));
            const next = students.filter(x => String(x.NIS) !== String(body.key));
            localStorage.setItem('edusmart_offline_students', JSON.stringify(next));
            resolve({ success:true, message:'Data siswa dihapus dari perangkat (Mode Offline).', data:null });
          } else if (action.startsWith('save')) {
            resolve({ success: true, message: 'Data berhasil tersimpan di perangkat (Mode Offline). Tidak dikirim ke Spreadsheet.', data: null });
          } else {
            resolve({ success: true, message: 'OK (Demo)', data: [] });
          }
        }, 300);
      });
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-red-600 text-white',
        warning: 'bg-amber-500 text-white',
        info: 'bg-indigo-600 text-white'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-xmark',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };
      toast.className = `${colors[type]} px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 animate-bounce transition transform duration-300 text-sm font-medium`;
      toast.innerHTML = `<i class="fa-solid ${icons[type]} text-lg"></i> <span>${message}</span>`;
      
      const container = document.getElementById('toast-container');
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function showLoading(show) {
      let loader = document.getElementById('app-loader');
      if (show) {
        if (!loader) {
          loader = document.createElement('div');
          loader.id = 'app-loader';
          loader.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center';
          loader.innerHTML = `
            <div class="bg-white p-5 rounded-2xl shadow-2xl flex items-center gap-3">
              <i class="fa-solid fa-circle-notch fa-spin text-indigo-600 text-2xl"></i>
              <span class="font-semibold text-slate-700 text-sm">Memuat Data...</span>
            </div>`;
          document.body.appendChild(loader);
        }
      } else if (loader) {
        loader.remove();
      }
    }

              <li><b>Konfigurasi aplikasi:</b> Buka website GitHub Pages, masukkan Spreadsheet ID dan Web App URL pada <b>Setup Database</b>, lalu klik <b>Simpan</b>. Konfigurasi koneksi disimpan di localStorage browser dan parameter database disimpan di sheet <code>Config</code>.</li>
              <li><b>Penting:</b> <code>Code.gs</code> tetap hanya dipasang di Google Apps Script. Jangan menaruh <b>OpenAI API Key</b> di repository GitHub.</li>
            </ol>
          </div>
        </div>
      `;
      openModal(content);
      if (initialTab === 'menu') setTimeout(() => switchSetupTab('menu'), 0);
      if (currentUser && String(currentUser.Role).toLowerCase() === 'guru') loadMenuGuruSettings();
    }

    function switchSetupTab(tabName) {
      ['config', 'menu', 'code', 'guide'].forEach(t => {
        document.getElementById(`setup-tab-${t}`).classList.add('hidden');
        document.getElementById(`tab-btn-${t}`).className = 'px-3 py-2 text-slate-600 hover:text-indigo-600';

      document.getElementById(`tab-btn-${tabName}`).className = 'px-3 py-2 border-b-2 border-indigo-600 text-indigo-600 font-semibold';

    // ============================================================
    // MENU UTAMA GURU DINAMIS
    // ============================================================
    function menuGuruIconHtml(icon) {
      const value = String(icon || '').trim();
      if (!value) return '<i class="fa-solid fa-link"></i>';
      if (/^fa-(solid|regular|brands)\s+fa-[a-z0-9-]+$/i.test(value)) return `<i class="${escapeHtml(value)}"></i>`;
      return escapeHtml(value.slice(0, 2));
    }

    function normalizeCustomMenuTarget(menu) {
      const target = String(menu && menu.Target || '').trim();
      if (!target) return '';
      if (String(menu.Tipe || 'file').toLowerCase() === 'link') return target;
      try { return new URL(target, window.location.href).href; } catch (e) { return target; }
    }

    function openCustomGuruMenu(menu) {
      if (!menu || String(menu.Status || 'aktif').toLowerCase() !== 'aktif') return;
      const target = normalizeCustomMenuTarget(menu);
      if (!target || /^(javascript|data|vbscript):/i.test(target)) {
        showToast('Target menu tidak valid atau tidak aman.', 'error'); return;
      }
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-indigo-50','text-indigo-600'));
      const safeId = String(menu.ID || '').replace(/[^a-zA-Z0-9_-]/g,'');
      const btn = document.getElementById('nav-custom-' + safeId);
      if (btn) btn.classList.add('bg-indigo-50','text-indigo-600');
      const tab = String(menu.TargetTab || 'same').toLowerCase() === 'blank' ? '_blank' : '_self';
      window.open(target, tab, tab === '_blank' ? 'noopener,noreferrer' : '');
    }

    async function loadGuruCustomMenus() {
      if (!currentUser || String(currentUser.Role).toLowerCase() !== 'guru') return;
      const holder = document.getElementById('guru-custom-menu-list');
      if (!holder) return;
      const res = await apiCall('getMenuGuru', {}, {
        username: currentUser.Username, role: currentUser.Role,
        spreadsheetId: config.spreadsheetId, includeInactive: false
      });
      if (!res.success) { holder.innerHTML = ''; return; }
      customGuruMenus = Array.isArray(res.data) ? res.data : [];
      holder.innerHTML = '';
      customGuruMenus.forEach(menu => {
        const safeId = String(menu.ID || '').replace(/[^a-zA-Z0-9_-]/g,'');
        const btn = document.createElement('button');
        btn.id = 'nav-custom-' + safeId;
        btn.className = 'nav-btn w-full text-left px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 flex items-center gap-3 transition';
        btn.title = menu.Target || '';
        const icon = document.createElement('span');
        icon.className = 'w-4 text-center text-indigo-600';
        const iconValue = String(menu.Ikon || '').trim();
        if (/^fa-(solid|regular|brands)\s+fa-[a-z0-9-]+$/i.test(iconValue)) icon.innerHTML = menuGuruIconHtml(iconValue);
        else icon.textContent = iconValue || '🔗';
        const label = document.createElement('span');
        label.className = 'truncate';
        label.textContent = menu.NamaMenu || 'Menu';
        btn.appendChild(icon); btn.appendChild(label);
        btn.onclick = () => openCustomGuruMenu(menu);
        holder.appendChild(btn);
      });
    }

    async function loadMenuGuruSettings() {
      const holder = document.getElementById('menu-guru-settings-list');
      if (!holder) return;
      if (!currentUser || String(currentUser.Role).toLowerCase() !== 'guru') {
        holder.innerHTML = '<div class="bg-red-50 text-red-700 rounded-xl p-3 text-xs">Pengaturan Menu Utama hanya tersedia untuk Guru.</div>'; return;
      }
      holder.innerHTML = '<div class="p-4 text-center text-xs text-slate-400"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Memuat menu...</div>';
      const res = await apiCall('getMenuGuru', {}, {
        username: currentUser.Username, role: currentUser.Role,
        spreadsheetId: config.spreadsheetId, includeInactive: true
      });
      if (!res.success) {
        holder.innerHTML = `<div class="bg-red-50 text-red-700 rounded-xl p-3 text-xs">${escapeHtml(res.message || 'Gagal memuat menu.')}</div>`; return;
      }
      customGuruMenus = Array.isArray(res.data) ? res.data : [];
      renderMenuGuruSettingsList();
    }

    function renderMenuGuruSettingsList() {
      const holder = document.getElementById('menu-guru-settings-list');
      if (!holder) return;
      if (!customGuruMenus.length) {
        holder.innerHTML = '<div class="border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center"><i class="fa-solid fa-folder-plus text-2xl text-slate-300"></i><p class="text-xs font-semibold text-slate-500 mt-2">Belum ada menu tambahan.</p><p class="text-[11px] text-slate-400 mt-1">Contoh: Kalender → kalender.html</p></div>';
        return;
      }
      holder.innerHTML = '';
      customGuruMenus.forEach(menu => {
        const item = document.createElement('div');
        item.draggable = true; item.dataset.id = menu.ID;
        item.className = 'menu-guru-sort-item bg-white border border-slate-200 rounded-2xl p-3 flex items-center gap-3 hover:border-indigo-200 transition';
        item.addEventListener('dragstart', () => { draggedMenuGuruId = menu.ID; item.classList.add('opacity-50'); });
        item.addEventListener('dragend', () => { draggedMenuGuruId = null; item.classList.remove('opacity-50'); });
        item.addEventListener('dragover', e => e.preventDefault());
        item.addEventListener('drop', e => { e.preventDefault(); reorderMenuGuruLocal(menu.ID); });

        const grip = document.createElement('div');
        grip.className = 'text-slate-300 cursor-grab px-1'; grip.innerHTML = '<i class="fa-solid fa-grip-vertical"></i>';
        const icon = document.createElement('div');
        icon.className = 'w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-sm';
        const iconValue = String(menu.Ikon || '').trim();
        if (/^fa-(solid|regular|brands)\s+fa-[a-z0-9-]+$/i.test(iconValue)) icon.innerHTML = menuGuruIconHtml(iconValue);
        else icon.textContent = iconValue || '🔗';

        const info = document.createElement('div'); info.className = 'flex-1 min-w-0';
        const name = document.createElement('div'); name.className = 'text-xs font-bold text-slate-800 truncate'; name.textContent = menu.NamaMenu || '';
        const target = document.createElement('div'); target.className = 'text-[10px] text-slate-400 truncate mt-0.5';
        target.textContent = `${String(menu.Tipe).toUpperCase()} • ${menu.Target} • ${String(menu.TargetTab || 'same') === 'blank' ? 'Tab baru' : 'Tab yang sama'}`;
        info.appendChild(name); info.appendChild(target);

        const status = document.createElement('span');
        status.className = 'text-[10px] px-2 py-1 rounded-full ' + (String(menu.Status).toLowerCase()==='aktif' ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500');
        status.textContent = String(menu.Status).toLowerCase()==='aktif' ? 'Aktif' : 'Nonaktif';

        const actions = document.createElement('div'); actions.className = 'flex items-center gap-1';
        const edit = document.createElement('button'); edit.className = 'p-2 rounded-lg text-indigo-600 hover:bg-indigo-50'; edit.title = 'Edit'; edit.innerHTML = '<i class="fa-solid fa-pen"></i>'; edit.onclick = () => openMenuGuruForm(menu);
        const del = document.createElement('button'); del.className = 'p-2 rounded-lg text-red-500 hover:bg-red-50'; del.title = 'Hapus'; del.innerHTML = '<i class="fa-solid fa-trash"></i>'; del.onclick = () => deleteMenuGuruItem(menu);
        actions.appendChild(edit); actions.appendChild(del);

        item.appendChild(grip); item.appendChild(icon); item.appendChild(info); item.appendChild(status); item.appendChild(actions);
        holder.appendChild(item);
      });
    }

    function reorderMenuGuruLocal(targetId) {
      if (!draggedMenuGuruId || draggedMenuGuruId === targetId) return;
      const from = customGuruMenus.findIndex(x => String(x.ID) === String(draggedMenuGuruId));
      const to = customGuruMenus.findIndex(x => String(x.ID) === String(targetId));
      if (from < 0 || to < 0) return;
      const moved = customGuruMenus.splice(from,1)[0];
      customGuruMenus.splice(to,0,moved);
      customGuruMenus.forEach((m,i) => m.Urutan = i+1);
      renderMenuGuruSettingsList();
      saveMenuGuruOrder();
    }

    async function saveMenuGuruOrder() {
      const res = await apiCall('reorderMenuGuru', {}, {
        username: currentUser.Username, role: currentUser.Role,
        spreadsheetId: config.spreadsheetId, ids: customGuruMenus.map(m => m.ID)
      });
      if (!res.success) showToast(res.message || 'Urutan menu gagal disimpan.', 'error');
      else await loadGuruCustomMenus();
    }

            <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-semibold">Batal</button><button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold"><i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Menu</button></div>
          </form>
        </div>
      `);
      document.getElementById('form-menu-guru').addEventListener('submit', saveMenuGuruForm);

    async function saveMenuGuruForm(e) {
      e.preventDefault();
      if (!currentUser || String(currentUser.Role).toLowerCase() !== 'guru') return;
      const tipe = document.getElementById('menu-tipe').value;
      const target = document.getElementById('menu-target').value.trim();
      if (tipe === 'link' && !/^https?:\/\//i.test(target)) { showToast('URL Link harus diawali http:// atau https://.', 'warning'); return; }
      if (/^\s*(javascript|data|vbscript):/i.test(target)) { showToast('Target menu tidak aman.', 'warning'); return; }
      const payload = {
        ID: document.getElementById('menu-id').value.trim(),
        NamaMenu: document.getElementById('menu-nama').value.trim(),
        Ikon: document.getElementById('menu-ikon').value.trim() || 'fa-solid fa-link',
        Tipe: tipe, Target: target,
        TargetTab: document.getElementById('menu-target-tab').value,
        Status: document.getElementById('menu-status').value,
        username: currentUser.Username, role: currentUser.Role, spreadsheetId: config.spreadsheetId
      };
      if (!payload.NamaMenu || !payload.Target) { showToast('Nama Menu dan Target wajib diisi.', 'warning'); return; }
      const res = await apiCall('saveMenuGuru', {}, payload);
      if (res.success) {
        showToast(res.message || 'Menu berhasil disimpan.', 'success');
        closeModal(); await loadMenuGuruSettings(); await loadGuruCustomMenus();
      } else showToast(res.message || 'Menu gagal disimpan.', 'error');
    }

    async function deleteMenuGuruItem(menu) {
      if (!menu || !menu.ID) return;
      if (!confirm(`Hapus menu "${menu.NamaMenu}"?`)) return;
      const res = await apiCall('deleteMenuGuru', {}, {ID:menu.ID, username:currentUser.Username, role:currentUser.Role, spreadsheetId:config.spreadsheetId});
      if (res.success) {
        showToast(res.message || 'Menu berhasil dihapus.', 'success');
        await loadMenuGuruSettings(); await loadGuruCustomMenus();
      } else showToast(res.message || 'Menu gagal dihapus.', 'error');
    }

    async function saveConfiguration() {
      const sheetId = document.getElementById('cfg-sheet-id').value.trim();
      const scriptUrl = document.getElementById('cfg-script-url').value.trim();
      const guruUsername = document.getElementById('cfg-guru-username').value.trim();
      const guruPassword = document.getElementById('cfg-guru-password').value.trim();
      const guruNama = document.getElementById('cfg-guru-nama').value.trim();
      const guruKelas = document.getElementById('cfg-guru-kelas').value.trim();

      if (!sheetId || !scriptUrl || !guruUsername || !guruPassword || !guruNama || !guruKelas) {
        showToast('Spreadsheet ID dan Web App URL harus diisi!', 'warning');
        return;
      }

      // Simpan lokal untuk koneksi browser. Setelah koneksi berhasil,
      // simpan juga permanen ke sheet Config melalui backend.
      config.spreadsheetId = sheetId;
      config.scriptUrl = scriptUrl;
      config.mode = 'online';
      config.isOnline = true;
      localStorage.setItem(APP_CONFIG_KEY, JSON.stringify(config));
      localStorage.setItem(LEGACY_SPREADSHEET_KEY, sheetId);
      localStorage.setItem(LEGACY_SCRIPT_URL_KEY, scriptUrl);
      updateDbStatusBadge();

      const res = await apiCall('saveAppConfig', {}, {
        SPREADSHEET_ID: sheetId,
        APPSCRIPT_URL: scriptUrl,
        GURU_USERNAME: guruUsername,
        GURU_PASSWORD: guruPassword,
        GURU_NAMA: guruNama,
        GURU_KELAS: guruKelas
      });

      if (res.success) {
        showToast('✅ Konfigurasi tersimpan di Spreadsheet Config.', 'success');
        const setupRes = await apiCall('setupDatabase');
        if (setupRes.success) {
          showToast('🗄️ Database dan konfigurasi berhasil disiapkan.', 'success');
        } else {
          showToast('Konfigurasi tersimpan, tetapi setup database gagal: ' + setupRes.message, 'warning');
        }
      } else {
        showToast('Gagal menyimpan Config ke Spreadsheet: ' + res.message, 'error');
      }
    }

    async function testConnection() {
      if (!config.scriptUrl || !config.spreadsheetId) {
        showToast('Atur Spreadsheet ID dan Web App URL terlebih dahulu melalui Setup Database.', 'warning');
        return;
      }
      const res = await apiCall('testConnection');
      if (res.success) {
        config.mode = 'online';
        config.isOnline = true;
        localStorage.setItem(APP_CONFIG_KEY, JSON.stringify(config));
        updateDbStatusBadge();
        showToast('🟢 ' + res.message, 'success');
      } else {
        config.mode = 'offline';
        config.isOnline = false;
        localStorage.setItem(APP_CONFIG_KEY, JSON.stringify(config));
        updateDbStatusBadge();
        showToast('🔴 Gagal Koneksi: ' + res.message, 'error');
      }
    }

    async function triggerSetupDatabase() {
      const res = await apiCall('setupDatabase');
      if (res.success) {
        showToast('🗄️ ' + res.message, 'success');
      } else {
        showToast('Gagal membuat struktur DB: ' + res.message, 'error');
      }
    }

    function clearConfiguration() {
      config = { spreadsheetId: '', scriptUrl: '', mode: 'offline', isOnline: false };
      localStorage.removeItem(APP_CONFIG_KEY);
      localStorage.removeItem(LEGACY_SPREADSHEET_KEY);
      localStorage.removeItem(LEGACY_SCRIPT_URL_KEY);
      updateDbStatusBadge();
      showToast('Konfigurasi browser dihapus. Data Config di Spreadsheet tetap tersimpan.', 'info');
      closeModal();
    }

    function copyAppsScriptCode() {
      const code = document.getElementById('code-gs-view').value;
      navigator.clipboard.writeText(code);
      showToast('Kode Code.gs berhasil disalin ke clipboard!', 'success');
    }

    function downloadAppsScriptCode() {
      const code = document.getElementById('code-gs-view').value;
      const blob = new Blob([code], { type: 'text/javascript' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Code.gs';
      a.click();
      showToast('File Code.gs berhasil diunduh.', 'success');
    }
