    async function handleLoginSubmit(e) {
      e.preventDefault();
      const role = document.getElementById('login-role').value;
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const spreadsheetId = document.getElementById('login-db-code').value.trim();

      // MODE OFFLINE: otomatis dipakai jika Web App URL belum dikonfigurasi.
      // Tidak melakukan koneksi atau request apa pun ke Spreadsheet.
      if (config.mode !== 'online' || !config.scriptUrl) {
        if (role !== 'guru') {
          showToast('Mode Offline hanya tersedia untuk login Guru. Hubungkan Spreadsheet untuk login Siswa.', 'warning');
          selectLoginRole('guru');
          return;
        }
        if (username.toLowerCase() !== 'guru' || password !== '11223344') {
          showToast('Login Offline: username guru, password 11223344.', 'error');
          return;
        }
        currentUser = { ID:'OFFLINE-GURU', Username:'guru', Nama:'Guru Offline', Role:'guru', NIP:'', Kelas:'' };
        config.isOnline = false;
        localStorage.setItem(APP_CONFIG_KEY, JSON.stringify(config));
        localStorage.setItem(APP_SESSION_KEY, JSON.stringify(currentUser));
        updateDbStatusBadge();
        showToast('Masuk sebagai Guru Offline. Tidak ada koneksi ke Spreadsheet.', 'success');
        renderAppLayout();
        return;
      }

      if (!spreadsheetId) { showToast('Masukkan Kode dari Guru terlebih dahulu.', 'warning'); return; }
      config.spreadsheetId = spreadsheetId;
      config.mode = 'online';
      config.isOnline = true;
      localStorage.setItem(APP_CONFIG_KEY, JSON.stringify(config));
      updateDbStatusBadge();

      const res = await apiCall('login', {}, { username, password, role, spreadsheetId });
      if (res.success) {
        currentUser = res.data;
        localStorage.setItem(APP_SESSION_KEY, JSON.stringify(currentUser));
        showToast(`Selamat datang, ${currentUser.Nama}!`, 'success');
        renderAppLayout();
        speakWelcomeMessage();
      } else {
        showToast(res.message, 'error');
      }
    }

    function fillGuruProfileForm(profile) {
      if (!profile) return;
      const values = {

        'guru-profile-name': profile.Nama || '',

        'guru-profile-mapel': profile.MapelUtama || '',
        'guru-profile-kelas': profile.Kelas || ''
      };
      Object.keys(values).forEach(id => { const el=document.getElementById(id); if(el) el.value=values[id]; });

    }

    function handleGuruPhotoSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { showToast('File harus berupa gambar.', 'warning'); return; }
      if (file.size > 2 * 1024 * 1024) { showToast('Ukuran foto maksimal 2 MB agar localStorage tidak cepat penuh.', 'warning'); event.target.value=''; return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          localStorage.setItem(getGuruPhotoStorageKey(), String(e.target.result || ''));
          renderGuruLocalPhotoPreview();
          applyGuruIdentityUI();
          refreshGuruDashboardIdentity();
          showToast('Foto Guru disimpan di browser ini.', 'success');
        } catch (err) {
          showToast('Foto gagal disimpan. Penyimpanan browser mungkin penuh.', 'error');
        }
      };
      reader.readAsDataURL(file);
    }

    function renderGuruLocalPhotoPreview() {
      const img = document.getElementById('guru-profile-photo-preview');
      const fallback = document.getElementById('guru-profile-photo-fallback');
      const src = getGuruLocalPhoto();
      if (!img || !fallback) return;
      if (src) { img.src=src; img.classList.remove('hidden'); fallback.classList.add('hidden'); }
      else { img.removeAttribute('src'); img.classList.add('hidden'); fallback.classList.remove('hidden'); }
    }

    function removeGuruLocalPhoto() {
      try { localStorage.removeItem(getGuruPhotoStorageKey()); } catch(e) {}
      renderGuruLocalPhotoPreview(); applyGuruIdentityUI(); refreshGuruDashboardIdentity();
      showToast('Foto Guru dihapus dari browser ini.', 'info');
    }

    async function saveGuruProfileFromUI(event) {

      const payload = {

        role: currentUser.Role,

        Kelas: document.getElementById('guru-profile-kelas').value.trim()
      };
      if (!payload.Nama) { showToast('Nama Guru wajib diisi.', 'warning'); return; }
      const res = await apiCall('saveGuruProfile', {}, payload);
      if (res.success) {
        currentUser = Object.assign({}, currentUser, res.data || payload);

        applyGuruIdentityUI(); refreshGuruDashboardIdentity();
        showToast(res.message || 'Profil Guru berhasil disimpan.', 'success');

    }

    async function loadAiStatus() {
      const el = document.getElementById('ai-quota-badge');
      if (!el) return;
      const res = await apiCall('getOpenAiStatus', {}, { username: currentUser.Username, role: currentUser.Role, spreadsheetId: config.spreadsheetId });
      if (res.success && res.data) el.textContent = `${res.data.used || 0}/${res.data.limit || 20} penggunaan hari ini`;

    function appendAiChat(who, text, mine) {
      const box = document.getElementById('ai-chat-box');
      if (!box) return;
      const safe = escapeHtml(text).replace(/\n/g, '<br>');
      box.innerHTML += `<div class="${mine ? 'bg-indigo-900/60 ml-auto border-indigo-700 text-right' : 'bg-slate-800 border-slate-700'} p-3 rounded-2xl max-w-2xl border">${mine ? '👨‍🏫' : '🤖'} <b>${who}:</b> ${safe}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    async function sendAiMessage(textOverride) {
      if (!currentUser || String(currentUser.Role).toLowerCase() !== 'guru') return;
      const input = document.getElementById('ai-input');
      const userText = String(textOverride || (input && input.value) || '').trim();
      if (!userText) return;
      if (input) input.value = '';
      appendAiChat('Anda', userText, true);
      const res = await apiCall('haloHalo', {}, { username: currentUser.Username, role: currentUser.Role, text: userText });
      if (!res.success) { appendAiChat('Halo-Halo', res.message || 'AI gagal memproses perintah.', false); speakText(res.message || 'AI gagal memproses perintah.'); return; }
      handleHaloHaloResult(res.data || {});
      loadAiStatus();
    }

    function handleHaloHaloResult(data) {
      const reply = data.reply || data.message || 'Perintah diproses.';
      appendAiChat('Halo-Halo', reply, false);
      speakText(reply);
      if (data.action === 'open_view' && data.view) {
        navigateTo(data.view);
      } else if (data.action === 'search_student' && data.student) {
        const s = data.student;
        const text = `Siswa ditemukan: ${s.Nama || '-'}, NIS ${s.NIS || '-'}, kelas ${s.Kelas || '-'}.`;
        appendAiChat('Halo-Halo', text, false);
        speakText(text);
      } else if (data.action === 'input_grade' && data.intent) {
        window.pendingHaloGrade = data.intent;
        const summary = `Saya akan memasukkan nilai ${data.intent.Nilai} untuk NIS ${data.intent.NIS}, penilaian ${data.intent.JenisPenilaian || '-'}${data.intent.KodeMapel ? ', mapel ' + data.intent.KodeMapel : ''}. Ucapkan “ya” untuk menyimpan atau “batal” untuk membatalkan.`;
        appendAiChat('Halo-Halo', summary, false);
        speakText(summary);
      }
    }

    async function confirmHaloGrade() {
      if (!window.pendingHaloGrade) return;
      const intent = window.pendingHaloGrade;
      const res = await apiCall('haloHaloConfirm', {}, { username: currentUser.Username, role: currentUser.Role, intent: intent });
      if (res.success) {
        appendAiChat('Halo-Halo', res.message || 'Nilai berhasil disimpan.', false);
        speakText(res.message || 'Nilai berhasil disimpan.');
        window.pendingHaloGrade = null;
        navigateTo('penilaian');
      } else {
        appendAiChat('Halo-Halo', res.message || 'Nilai tidak disimpan.', false);
        speakText(res.message || 'Nilai tidak disimpan.');
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(String(text || ''));
      utter.lang = 'id-ID';
      utter.rate = 1;
      window.speechSynthesis.speak(utter);
    }

          <div id="siswa-nilai-container" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">Memuat nilai...</div>
        </div>
      `;
      const res = await apiCall('getGrades');
      const list = (res.data || []).filter(n => n.NIS == currentUser.NIS || !n.NIS);
      document.getElementById('siswa-nilai-container').innerHTML = list.length ? list.map(n => `
        <div class="flex justify-between items-center py-2 border-b text-xs">
          <div><b class="text-indigo-600">${n.KodeMapel}</b> - ${n.JenisPenilaian}</div>
          <span class="font-bold text-sm text-slate-800">${n.Nilai}</span>
        </div>
      `).join('') : '<p class="text-xs text-slate-400">Belum ada data nilai.</p>';
    }

    async function renderAbsensiSiswaView(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <h2 class="text-xl font-bold text-slate-800">Rekap Absensi Saya</h2>
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-xs">
            <p class="text-slate-500 mb-2">Total Kehadiran Semester Ini: <b>98%</b></p>
          </div>
        </div>
      `;
    }

    async function renderGameEdukasiView(container) {
      container.innerHTML = `
        <div class="max-w-md mx-auto bg-white p-6 rounded-3xl shadow-xl border border-slate-100 text-center space-y-4">
          <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-xl font-bold"><i class="fa-solid fa-gamepad"></i></div>
          <h3 class="text-lg font-bold text-slate-800">Game: Tebak Jawaban Matematika</h3>
          <p class="text-xs text-slate-500" id="game-q">Berapakah 7 x 8?</p>
          <div class="grid grid-cols-2 gap-2 text-xs font-bold">
            <button onclick="checkGameAnswer(56)" class="p-3 bg-slate-100 hover:bg-emerald-500 hover:text-white rounded-xl">56</button>
            <button onclick="checkGameAnswer(48)" class="p-3 bg-slate-100 hover:bg-emerald-500 hover:text-white rounded-xl">48</button>
            <button onclick="checkGameAnswer(54)" class="p-3 bg-slate-100 hover:bg-emerald-500 hover:text-white rounded-xl">54</button>
            <button onclick="checkGameAnswer(64)" class="p-3 bg-slate-100 hover:bg-emerald-500 hover:text-white rounded-xl">64</button>
          </div>
        </div>
      `;
    }

    function checkGameAnswer(val) {
      if (val === 56) showToast('Jawaban Benar! 🎉 +10 Poin', 'success');
      else showToast('Jawaban Salah, coba lagi!', 'error');
    }

    async function renderKuisSiswaView(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <h2 class="text-xl font-bold text-slate-800">Kuis Interactive</h2>
          <div id="kuis-box" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-xs space-y-4">
            <h3 class="font-bold text-base text-indigo-600">Kuis Bab 1 Aljabar Dasar</h3>
            <p class="text-slate-500">Jumlah Soal: 3 | Durasi: 15 Menit</p>
            <button onclick="startInteractiveQuiz()" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded-xl">Mulai Kuis Sekarang</button>
          </div>
        </div>
      `;
    }

    async function startInteractiveQuiz() {
      const res = await apiCall('getQuizQuestions');
      const questions = res.data || MOCK_DATA.SoalKuis;

      let currentQ = 0;
      let score = 0;

      function renderQuestion() {
        const q = questions[currentQ];
        document.getElementById('kuis-box').innerHTML = `
          <div class="space-y-3">
            <div class="flex justify-between items-center text-slate-400 font-semibold">
              <span>Soal ${currentQ + 1} dari ${questions.length}</span>
              <span class="text-indigo-600">Aljabar</span>
            </div>
            <h4 class="font-bold text-sm text-slate-800">${q.Pertanyaan}</h4>
            <div class="space-y-2">
              <label class="block p-3 border rounded-xl hover:bg-indigo-50 cursor-pointer"><input type="radio" name="opt" value="A"> A. ${q.OpsiA}</label>
              <label class="block p-3 border rounded-xl hover:bg-indigo-50 cursor-pointer"><input type="radio" name="opt" value="B"> B. ${q.OpsiB}</label>
              <label class="block p-3 border rounded-xl hover:bg-indigo-50 cursor-pointer"><input type="radio" name="opt" value="C"> C. ${q.OpsiC}</label>
              <label class="block p-3 border rounded-xl hover:bg-indigo-50 cursor-pointer"><input type="radio" name="opt" value="D"> D. ${q.OpsiD}</label>
            </div>
            <button id="btn-next-q" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl mt-3">Lanjut / Selesai</button>
          </div>
        `;

        document.getElementById('btn-next-q').onclick = () => {
          const sel = document.querySelector('input[name="opt"]:checked');
          if (sel && sel.value === q.KunciJawaban) score++;
          currentQ++;
          if (currentQ < questions.length) renderQuestion();
          else {
            const finalScore = Math.round((score / questions.length) * 100);
            document.getElementById('kuis-box').innerHTML = `
              <div class="text-center space-y-3 py-4">
                <h3 class="text-xl font-bold text-emerald-600">Kuis Selesai!</h3>
                <p class="text-2xl font-extrabold text-slate-800">Skor Anda: ${finalScore}</p>
                <p class="text-slate-500">Benar ${score} dari ${questions.length} soal.</p>
                <button onclick="renderKuisSiswaView(document.getElementById('main-view-container'))" class="bg-indigo-600 text-white px-4 py-2 rounded-xl">Kembali</button>
              </div>
            `;
          }
        };
      }
      renderQuestion();
    }

    async function renderPengumumanSiswaView(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <h2 class="text-xl font-bold text-slate-800">Pengumuman Sekolah</h2>
          <div id="announcement-list" class="space-y-3">Memuat pengumuman...</div>
        </div>
      `;
      const res = await apiCall('getAnnouncements');
      const list = res.data || [];
      document.getElementById('announcement-list').innerHTML = list.length ? list.map(a => `
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-xs">
          <div class="flex justify-between text-slate-400 mb-1">
            <span><i class="fa-solid fa-bullhorn text-indigo-600"></i> ${a.Pembuat || 'Admin'}</span>
            <span>${a.Tanggal}</span>
          </div>
          <h4 class="font-bold text-slate-800 text-sm mb-1">${a.Judul}</h4>
          <p class="text-slate-600 leading-relaxed">${a.Isi}</p>
        </div>
      `).join('') : '<p class="text-xs text-slate-400">Belum ada pengumuman.</p>';
    }

    // ==========================================
    // VOICE ASSISTANT ENGINE (WEB SPEECH API)
    // ==========================================
    let recognition = null;

    function speakWelcomeMessage() {
      const text = currentUser
        ? (currentUser.Role === 'guru' ? `Hai Pak atau Bu ${currentUser.Nama}, apa yang bisa saya bantu?` : `Hai ${currentUser.Nama}, apa yang ingin kamu pelajari hari ini?`)
        : 'Selamat datang di Sistem Pembelajaran Digital. Silakan masuk akun Anda.';
      speakText(text);
    }

    function toggleVoiceListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { showToast('Browser Anda belum mendukung Web Speech API.', 'warning'); return; }
      if (recognition) { recognition.stop(); recognition = null; showToast('Asisten suara dimatikan', 'info'); return; }
      recognition = new SpeechRecognition();
      recognition.lang = 'id-ID';
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onstart = () => showToast('🎙️ Mendengarkan perintah suara...', 'info');
      recognition.onresult = (e) => {
        const cmd = String(e.results[0][0].transcript || '').trim();
        showToast(`Perintah diterima: "${cmd}"`, 'success');
        if (currentUser && String(currentUser.Role).toLowerCase() === 'guru') {
          const low = cmd.toLowerCase();
          if (window.pendingHaloGrade && /^(ya|iya|yes|oke|ok|simpan|lanjut|setuju)\b/.test(low)) { confirmHaloGrade(); return; }
          if (window.pendingHaloGrade && /^(batal|tidak|nggak|jangan|cancel)\b/.test(low)) { window.pendingHaloGrade = null; appendAiChat('Halo-Halo','Baik, penyimpanan dibatalkan.',false); speakText('Baik, penyimpanan dibatalkan.'); return; }
          sendAiMessage(cmd);
        } else processVoiceCommandStudent(cmd.toLowerCase());
      };
      recognition.onerror = () => { showToast('Tidak dapat mengenali suara, coba lagi.', 'error'); recognition = null; };
      recognition.onend = () => { recognition = null; };
      recognition.start();
    }

    function processVoiceCommand(cmd) {
      if (!currentUser) return;
      if (String(currentUser.Role).toLowerCase() === 'guru') sendAiMessage(cmd);
      else processVoiceCommandStudent(cmd);
    }

    function processVoiceCommandStudent(cmd) {
      if (cmd.includes('profil')) navigateTo('profil-siswa');
      else if (cmd.includes('nilai')) navigateTo('nilai-siswa');
      else if (cmd.includes('absensi')) navigateTo('absensi-siswa');
      else if (cmd.includes('kuis')) navigateTo('kuis-siswa');
      else if (cmd.includes('pengumuman')) navigateTo('pengumuman-siswa');
    }

    // ==========================================
    // EXCEL IMPORT & TEMPLATE ENGINE
    // ==========================================
    const EXCEL_CONFIG = {
      siswa: {
        title: 'Import Data Siswa', sheet: 'Siswa', action: 'importStudents', key: 'NIS',
        filename: 'Template_Data_Siswa.xlsx',
        headers: ['NIS','NISN','Nama','JenisKelamin','TempatLahir','TanggalLahir','Alamat','Kelas','NamaOrangTua','NoHP','Status'],
        required: ['NIS','Nama','JenisKelamin','Kelas']
      },
      mapel: {
        title: 'Import Master Mata Pelajaran', sheet: 'MasterMapel', action: 'importSubjects', key: 'Kode',
        filename: 'Template_Master_Mapel.xlsx',
        headers: ['Kode','NamaMapel','Guru','Kelas','Status'],
        required: ['Kode','NamaMapel','Guru','Kelas','Status']
      },
      absensi: {
        title: 'Import Absensi', sheet: 'Absensi', action: 'importAttendance', key: 'ID',
        filename: 'Template_Absensi.xlsx',
        headers: ['ID','Tanggal','Kelas','KodeMapel','NIS','NamaSiswa','StatusHadir'],
        required: ['Tanggal','Kelas','KodeMapel','NIS','NamaSiswa','StatusHadir']
      },
      nilai: {
        title: 'Import Nilai', sheet: 'Nilai', action: 'importGrades', key: 'ID',
        filename: 'Template_Nilai.xlsx',
        headers: ['ID','Kelas','KodeMapel','NIS','NamaSiswa','JenisPenilaian','Nilai','Tanggal'],
        required: ['Kelas','KodeMapel','NIS','NamaSiswa','JenisPenilaian','Nilai','Tanggal']
      },
      jurnal: {
        title: 'Import Jurnal Harian', sheet: 'Jurnal', action: 'importJournals', key: 'ID',
        filename: 'Template_Jurnal.xlsx',
        headers: ['ID','Tanggal','Kelas','KodeMapel','Materi','Kegiatan','Catatan'],
        required: ['Tanggal','Kelas','KodeMapel','Materi','Kegiatan']
      }
,
      pengumuman: {
        title: 'Import Pengumuman', sheet: 'Pengumuman', action: 'importAnnouncements', key: 'ID',
        filename: 'Template_Pengumuman.xlsx',
        headers: ['ID','Tanggal','Judul','Isi','TargetRole','TargetKelas','Pembuat'],
        required: ['Tanggal','Judul','Isi','TargetRole','TargetKelas','Pembuat']
      }
    };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    function downloadExcelTemplate(type) {
      const cfg = EXCEL_CONFIG[type];
      if (!cfg || typeof XLSX === 'undefined') { showToast('Library Excel belum siap.', 'error'); return; }
      const example = {};
      cfg.headers.forEach(h => example[h] = '');
      if (type === 'siswa') Object.assign(example, {NIS:'1004',NISN:'0051234564',Nama:'Nama Siswa',JenisKelamin:'L',TempatLahir:'Malang',TanggalLahir:'2010-01-01',Alamat:'Alamat lengkap',Kelas:'VII-A',NamaOrangTua:'Nama Orang Tua',NoHP:'08123456789',Status:'aktif'});
      if (type === 'mapel') Object.assign(example, {Kode:'IPA-7',NamaMapel:'IPA Terpadu',Guru:'Nama Guru',Kelas:'VII-A',Status:'aktif'});
      if (type === 'absensi') Object.assign(example, {ID:'ABS-001',Tanggal:new Date().toISOString().slice(0,10),Kelas:'VII-A',KodeMapel:'MTK-7',NIS:'1001',NamaSiswa:'Ahmad Rizky',StatusHadir:'Hadir'});
      if (type === 'nilai') Object.assign(example, {ID:'NIL-001',Kelas:'VII-A',KodeMapel:'MTK-7',NIS:'1001',NamaSiswa:'Ahmad Rizky',JenisPenilaian:'Tugas',Nilai:85,Tanggal:new Date().toISOString().slice(0,10)});
      if (type === 'jurnal') Object.assign(example, {ID:'JRN-001',Tanggal:new Date().toISOString().slice(0,10),Kelas:'VII-A',KodeMapel:'MTK-7',Materi:'Materi pembelajaran',Kegiatan:'Kegiatan pembelajaran',Catatan:'Catatan tambahan'});
      if (type === 'pengumuman') Object.assign(example, {ID:'PG-001',Tanggal:new Date().toISOString().slice(0,10),Judul:'Pengumuman Sekolah',Isi:'Isi pengumuman',TargetRole:'Semua',TargetKelas:'Semua',Pembuat:currentUser ? currentUser.Nama : 'Guru'});
      const ws = XLSX.utils.json_to_sheet([example], {header: cfg.headers});
      ws['!cols'] = cfg.headers.map(h => ({wch: Math.max(12, Math.min(28, h.length + 5))}));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, cfg.sheet);
      XLSX.writeFile(wb, cfg.filename);
      showToast('Template berhasil diunduh.', 'success');
    }

    function openExcelImportModal(type) {
      const cfg = EXCEL_CONFIG[type];
      if (!cfg) return;
      const required = cfg.required.map(h => `<span class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-lg">${h}</span>`).join(' ');
      openModal(`
        <div class="space-y-4">
          <div class="border-b pb-3">
            <h3 class="text-xl font-bold text-slate-800">${cfg.title}</h3>
            <p class="text-xs text-slate-500 mt-1">Unduh template, isi data, lalu upload kembali dalam format .xlsx atau .xls.</p>
          </div>
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
            <b>Kolom wajib:</b><div class="flex flex-wrap gap-1.5 mt-2">${required}</div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <button onclick="downloadExcelTemplate('${type}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2"><i class="fa-solid fa-file-arrow-down"></i> Download Template</button>
            <label class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer"><i class="fa-solid fa-file-import"></i> Pilih File Excel<input id="excel-file-input" type="file" accept=".xlsx,.xls" class="hidden" onchange="handleExcelFileSelected('${type}', this)"></label>
          </div>
          <div id="excel-preview-area" class="hidden"></div>
        </div>
      `);
    }

    async function handleExcelFileSelected(type, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!/\.(xlsx|xls)$/i.test(file.name)) { showToast('File harus berformat .xlsx atau .xls.', 'warning'); return; }
      try {
        const cfg = EXCEL_CONFIG[type];
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, {type:'array', cellDates:true});
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, {defval:'', raw:false});
        const normalized = rows.map(row => {
          const obj = {}; cfg.headers.forEach(h => obj[h] = row[h] == null ? '' : String(row[h]).trim()); return obj;
        });
        const validation = validateExcelRows(cfg, normalized);
        const area = document.getElementById('excel-preview-area');
        area.classList.remove('hidden');
        if (!validation.valid) {
          area.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-xs"><b>Validasi gagal:</b><ul class="list-disc list-inside mt-1">${validation.errors.slice(0,30).map(escapeHtml).map(e=>`<li>${e}</li>`).join('')}</ul></div>`;
          return;
        }
        window.pendingExcelImport = {type, records: normalized};
        const previewRows = normalized.slice(0,8);
        area.innerHTML = `
          <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-3 text-xs mb-3"><b>${normalized.length} baris siap diimport.</b> Periksa preview sebelum menyimpan.</div>
          <div class="overflow-auto border rounded-xl max-h-56"><table class="w-full text-[10px]"><thead class="bg-slate-50"><tr>${cfg.headers.map(h=>`<th class="p-2 text-left whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${previewRows.map(r=>`<tr class="border-t">${cfg.headers.map(h=>`<td class="p-2 whitespace-nowrap">${escapeHtml(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <div class="flex justify-end gap-2 mt-3"><button onclick="closeModal()" class="px-4 py-2 rounded-xl border text-xs font-semibold">Batal</button><button onclick="confirmExcelImport()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"><i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Database</button></div>`;
      } catch (err) { showToast('Gagal membaca Excel: ' + err.message, 'error'); }
    }

    function validateExcelRows(cfg, rows) {
      const errors = [];
      if (!rows.length) return {valid:false, errors:['File Excel tidak memiliki data.']};
      rows.forEach((r,i) => {
        cfg.required.forEach(h => { if (!String(r[h] || '').trim()) errors.push(`Baris ${i+2}: kolom ${h} wajib diisi.`); });
        if (cfg.sheet === 'Siswa' && r.JenisKelamin && !['L','P','Laki-laki','Perempuan'].includes(r.JenisKelamin)) errors.push(`Baris ${i+2}: JenisKelamin harus L/P.`);
        if (cfg.sheet === 'Absensi' && r.StatusHadir && !['Hadir','Izin','Sakit','Alpa'].includes(r.StatusHadir)) errors.push(`Baris ${i+2}: StatusHadir tidak valid.`);
        if (cfg.sheet === 'Nilai' && (Number(r.Nilai) < 0 || Number(r.Nilai) > 100 || isNaN(Number(r.Nilai)))) errors.push(`Baris ${i+2}: Nilai harus angka 0-100.`);
      });
      const seen = {};
      rows.forEach((r,i) => { const k=String(r[cfg.key]||'').trim(); if(k){ if(seen[k]) errors.push(`Baris ${i+2}: ${cfg.key} duplikat dengan baris ${seen[k]}.`); else seen[k]=i+2; } });
      return {valid: errors.length===0, errors};
    }

    async function confirmExcelImport() {
      const pending = window.pendingExcelImport;
      if (!pending) return;
      const cfg = EXCEL_CONFIG[pending.type];
      const res = await apiCall(cfg.action, {}, {records: pending.records});
      if (res.success) {
        const d = res.data || {};
        showToast(`Import selesai. Tambah: ${d.inserted || 0}, Update: ${d.updated || 0}, Lewati: ${d.skipped || 0}`, 'success');
        window.pendingExcelImport = null; closeModal(); refreshAfterImport(pending.type);
      } else showToast(res.message || 'Import gagal.', 'error');
    }

    function refreshAfterImport(type) {
      const map = {siswa:'data-siswa', mapel:'master-mapel', absensi:'absensi', nilai:'penilaian', jurnal:'jurnal'};
      navigateTo(map[type]);
    }

    // Utility for Excel Export
    function exportToExcel(tableID, filename = '') {
      const table = document.getElementById(tableID);
      let html = table.outerHTML;
      let url = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
      let downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = (filename || 'export') + '.xls';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }
  </script>
