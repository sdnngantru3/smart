    async function saveMenuGuruForm(e) {
      e.preventDefault();
      if (!currentUser || String(currentUser.Role).toLowerCase() !== 'guru') return;
      const tipe = document.getElementById('menu-tipe').value;
      const target = document.getElementById('menu-target').value.trim();
      if (tipe === 'link' && !/^https?:\/\//i.test(target)) { showToast('URL Link harus diawali http:// atau https://.', 'warning'); return; }
      if (/^\s*(javascript|data|vbscript):/i.test(target)) { showToast('Target menu tidak aman.', 'warning'); return; }
      const payload = {
        ID: document.getElementById('menu-id').value.trim(),
        NamaMenu: document.getElementById('menu-nama').value.trim(),
        Ikon: document.getElementById('menu-ikon').value.trim() || 'fa-solid fa-link',
        Tipe: tipe, Target: target,
        TargetTab: document.getElementById('menu-target-tab').value,
        Status: document.getElementById('menu-status').value,
        username: currentUser.Username, role: currentUser.Role, spreadsheetId: config.spreadsheetId
      };
      if (!payload.NamaMenu || !payload.Target) { showToast('Nama Menu dan Target wajib diisi.', 'warning'); return; }
      const res = await apiCall('saveMenuGuru', {}, payload);
      if (res.success) {
        showToast(res.message || 'Menu berhasil disimpan.', 'success');
        closeModal(); await loadMenuGuruSettings(); await loadGuruCustomMenus();
      } else showToast(res.message || 'Menu gagal disimpan.', 'error');
    }

    async function saveConfiguration() {
      const sheetId = document.getElementById('cfg-sheet-id').value.trim();
      const guruUsername = document.getElementById('cfg-guru-username').value.trim();
      const guruPassword = document.getElementById('cfg-guru-password').value.trim();
      const guruNama = document.getElementById('cfg-guru-nama').value.trim();
      const guruKelas = document.getElementById('cfg-guru-kelas').value.trim();

      if (!sheetId || !guruUsername || !guruPassword || !guruNama || !guruKelas) {
        showToast('Spreadsheet ID dan data akun Guru harus diisi!', 'warning');
        return;
      }

      config.spreadsheetId = sheetId;
      localStorage.setItem(LEGACY_SPREADSHEET_KEY, sheetId);

      // Prioritas 1: ambil APPSCRIPT_URL otomatis dari Config.
      let boot = await bootstrapResolveConfig(sheetId, false);
      let normalizedScriptUrl = normalizeAppsScriptUrl(config.scriptUrl);

      // Prioritas 2: bila database baru belum punya APPSCRIPT_URL, gunakan URL manual.
      if (!boot.success || !normalizedScriptUrl) {
        const manualScriptUrl = normalizeAppsScriptUrl(document.getElementById('cfg-script-url')?.value || '');
        if (!manualScriptUrl) {
          setBootstrapSetupState(true, '🟡 APPSCRIPT_URL belum ditemukan di Config. Untuk database baru, masukkan URL Web App terlebih dahulu.', 'warning');
          showToast('APPSCRIPT_URL belum ada di Config. Isi URL Web App untuk setup pertama.', 'warning');
          return;
        }
        config.scriptUrl = manualScriptUrl;
        normalizedScriptUrl = manualScriptUrl;
        config.mode = 'online';
        config.isOnline = true;
        setBootstrapSetupState(false, '🟢 URL Web App manual siap digunakan dan akan disimpan ke Config.', 'success');
      }

      config.scriptUrl = normalizedScriptUrl;
      config.mode = 'online';
      config.isOnline = true;
      localStorage.setItem(APP_CONFIG_KEY, JSON.stringify(config));
      localStorage.setItem(LEGACY_SCRIPT_URL_KEY, normalizedScriptUrl);
      updateDbStatusBadge();
      if (currentUser && String(currentUser.Role || '').toLowerCase() === 'guru') renderSidebarNav();

      const res = await apiCall('saveAppConfig', {}, {
        SPREADSHEET_ID: sheetId,
        APPSCRIPT_URL: normalizedScriptUrl,
        GURU_USERNAME: guruUsername,
        GURU_PASSWORD: guruPassword,
        GURU_NAMA: guruNama,
        GURU_KELAS: guruKelas
      });

      if (res.success) {
        showToast('✅ Konfigurasi tersimpan. Koneksi database siap digunakan.', 'success');

        if (status) status.textContent = '🟢 APPSCRIPT_URL siap digunakan.';

        if (setupRes.success) {
          showToast('🗄️ Database dan konfigurasi berhasil disiapkan.', 'success');
        } else {
          showToast('Konfigurasi tersimpan, tetapi setup database gagal: ' + setupRes.message, 'warning');
        }
      } else {
        config.mode = 'offline';
        config.isOnline = false;
        localStorage.setItem(APP_CONFIG_KEY, JSON.stringify(config));
        updateDbStatusBadge();
        if (currentUser && String(currentUser.Role || '').toLowerCase() === 'guru') renderSidebarNav();
        showToast('Gagal menyimpan Config ke Spreadsheet: ' + res.message, 'error');

    }

    // ============================================================
    // SINKRONISASI MODE ONLINE
    // Menu ini hanya ditampilkan ketika MODE ONLINE aktif.
    // Data offline dikirim ke Google Apps Script -> Spreadsheet.
    // ============================================================
    function isOnlineMode() {
      return !!(config && config.mode === 'online' && config.isOnline &&
        config.scriptUrl && config.spreadsheetId);
    }

    function collectOfflineSyncData() {
      const recordsBySheet = {};
      const keyPrefix = 'edusmart_offline_';

      // Data siswa yang memang sudah disimpan oleh aplikasi pada MODE OFFLINE.
      try {
        const students = JSON.parse(
          localStorage.getItem('edusmart_offline_students') || '[]'
        );
        if (Array.isArray(students) && students.length) {
          recordsBySheet.Siswa = students;
        }
      } catch (e) {}

      // Mendukung data offline tambahan bila tersedia pada localStorage
      // dengan pola edusmart_offline_<NamaSheet>.
      const supportedSheets = [
        'Siswa', 'MasterMapel', 'Absensi', 'Nilai', 'PenilaianConfig',
        'Jurnal', 'Pengumuman', 'HasilKuis'
      ];
      supportedSheets.forEach(sheetName => {
        if (recordsBySheet[sheetName]) return;
        try {
          const raw = localStorage.getItem(keyPrefix + sheetName.toLowerCase());
          if (!raw) return;
          const data = JSON.parse(raw);
          if (Array.isArray(data) && data.length) recordsBySheet[sheetName] = data;
        } catch (e) {}
      });

      return recordsBySheet;
    }

    async function syncOfflineDataToSpreadsheet() {
      if (!isOnlineMode()) {
        showToast('Menu Sinkron hanya tersedia pada MODE ONLINE.', 'warning');
        return;
      }

      const recordsBySheet = collectOfflineSyncData();
      const total = Object.keys(recordsBySheet).reduce(
        (sum, key) => sum + (Array.isArray(recordsBySheet[key]) ? recordsBySheet[key].length : 0), 0
      );

      if (!total) {
        showToast('Tidak ada data offline yang perlu disinkronkan.', 'info');
        return;
      }

      if (!confirm('Kirim ' + total + ' data offline ke Google Spreadsheet sekarang?')) return;

      showLoading(true);
      try {
        const res = await apiCall('syncOfflineData', {}, { recordsBySheet });
        if (res && res.success) {
          // Setelah berhasil, data siswa lokal dibersihkan agar tidak terkirim ulang.
          if (recordsBySheet.Siswa) {
            localStorage.removeItem('edusmart_offline_students');
          }
          showToast('✓ ' + (res.message || 'Sinkronisasi berhasil.'), 'success');
          if (currentUser && String(currentUser.Role || '').toLowerCase() === 'guru') {
            renderSidebarNav();
          }
        } else {
          showToast('Sinkronisasi gagal: ' + ((res && res.message) || 'Respons tidak valid.'), 'error');
        }
      } catch (e) {
        showToast('Sinkronisasi gagal: ' + (e.message || e), 'error');
      } finally {
        showLoading(false);
      }
    }

      if (!currentUser || String(currentUser.Role || '').toLowerCase() !== 'siswa') {

      const base = new URL('./kuis.html', window.location.href);

                  <th class="p-3">Status</th>

              </thead>

              </tbody>
            </table>
          </div>
        </div>
      `;

      // Ambil SEMUA siswa dari database terlebih dahulu.
      // Jangan kirim currentUser.Kelas ke backend karena format kelas pada akun guru
      // bisa berbeda dengan format pada Sheet Siswa (spasi, huruf besar/kecil, dll).
      // Penyaringan kelas dilakukan di sisi tampilan sehingga opsi "Semua Kelas"
      // benar-benar dapat menampilkan seluruh siswa dari database.
      let res = await apiCall('getStudents', {});
      // Apps Script kadang membutuhkan waktu pada request pertama setelah deployment.
      // Jika request pertama gagal sementara, coba sekali lagi setelah jeda singkat.
      if (!res.success) {
        await new Promise(r => setTimeout(r, 1800));
        res = await apiCall('getStudents', {});
      }
      if (!res.success) {
        window.cachedStudents = [];
        const tbody = document.getElementById('tbody-siswa');
        if (tbody) tbody.innerHTML = `<tr><td colspan="9" class="p-5 text-center text-red-500 font-semibold">Gagal mengambil data siswa: ${escapeHtml(res.message || 'Koneksi API gagal.')}</td></tr>`;
        return;
      }
      window.cachedStudents = Array.isArray(res.data) ? res.data : [];

      // Isi filter kelas secara otomatis berdasarkan kelas yang benar-benar ada di database.
      // Nilai kosong berarti "Semua Kelas".
      const classFilter = document.getElementById('filter-kelas-siswa');
      if (classFilter) {
        const classMap = {};
        window.cachedStudents.forEach(s => {
          const kelas = String(s.Kelas || '').trim();
          if (kelas) classMap[kelas.toLowerCase()] = kelas;
        });
        const classes = Object.values(classMap).sort((a, b) =>
          a.localeCompare(b, 'id', { numeric: true, sensitivity: 'base' })
        );
        classFilter.innerHTML = '<option value="">Semua Kelas</option>' +
          classes.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');

        // Semua pengguna dapat memilih "Semua Kelas" atau kelas tertentu.
        // Default selalu Semua Kelas agar data siswa tidak hilang hanya karena
        // nilai Kelas pada profil pengguna berbeda dari nilai di Sheet Siswa.
        classFilter.value = '';
        classFilter.disabled = false;
      }
      renderSiswaRows(window.cachedStudents);
    }

    function refreshDynamicPenilaianTable(){
      const box=document.getElementById('dynamic-penilaian-table'); if(!box)return; const state=window.penilaianState;
      const subjects=state.subjects.filter(s=>String(s.Status||'aktif').toLowerCase()!=='nonaktif'); const configs=state.configs.filter(c=>String(c.Status||'aktif').toLowerCase()!=='nonaktif').sort((a,b)=>String(a.KodeMapel).localeCompare(String(b.KodeMapel))||Number(a.Urutan||0)-Number(b.Urutan||0));
      const columns=[]; subjects.forEach(s=>configs.filter(c=>String(c.KodeMapel)===String(s.Kode)).forEach(c=>columns.push({kode:s.Kode,mapel:s.NamaMapel,komponen:c.Komponen})));
      if(!columns.length){box.innerHTML='<div class="p-8 text-center text-xs text-slate-400">Belum ada kolom penilaian. Klik “Tambah Kolom Penilaian”.</div>';updatePendingGradeIndicator();return;}
      const filter=document.getElementById('penilaian-filter-kelas')?.value||''; const students=state.students.filter(s=>!filter||String(s.Kelas)===filter); const gradeMap={};
      state.grades.forEach(g=>{gradeMap[`${g.NIS}|${g.KodeMapel}|${String(g.JenisPenilaian||'').trim().toLowerCase()}`]=g.Nilai;});
      Object.values(state.pendingGrades||{}).forEach(g=>{gradeMap[`${g.NIS}|${g.KodeMapel}|${String(g.JenisPenilaian||'').trim().toLowerCase()}`]=g.Nilai;});
      const groups=subjects.map(s=>({s,cols:columns.filter(c=>String(c.kode)===String(s.Kode))})).filter(g=>g.cols.length);
      let html='<table class="min-w-max w-full text-xs"><thead><tr class="bg-slate-800 text-white"><th rowspan="2" class="p-2 sticky left-0 bg-slate-800 z-20">NIS</th><th rowspan="2" class="p-2 sticky left-[70px] bg-slate-800 z-20">Nama Siswa</th><th rowspan="2" class="p-2">Kelas</th>';

    function selectHasilBelajarStudent(nis) {

    function getHasilBelajarRows(nis) {
      const selected = String(nis || '').trim();
      if (!selected) return [];
      const gradeBySubject = {};
      (hasilBelajarState.grades || []).forEach(g => {
        if (String(g.NIS || '').trim() !== selected) return;
        const kode = String(g.KodeMapel || '').trim();
        const nilai = Number(g.Nilai);
        if (!kode || !Number.isFinite(nilai)) return;
        if (!gradeBySubject[kode]) gradeBySubject[kode] = [];
        gradeBySubject[kode].push(nilai);
      });
      const rows = [];
      (hasilBelajarState.subjects || []).forEach(s => {
        const kode = String(s.Kode || '').trim();
        const vals = gradeBySubject[kode] || [];
        if (!vals.length) return;
        const avg = vals.reduce((a,b) => a + b, 0) / vals.length;
        rows.push({ kode, mapel: String(s.NamaMapel || kode), nilai: Math.round(avg * 100) / 100 });
      });
      // Jika ada kode mapel pada Nilai yang belum ada di Master Mapel, tetap tampilkan.
      Object.keys(gradeBySubject).forEach(kode => {
        if (rows.some(r => r.kode === kode)) return;
        const vals = gradeBySubject[kode];
        const avg = vals.reduce((a,b) => a + b, 0) / vals.length;
        rows.push({ kode, mapel: kode, nilai: Math.round(avg * 100) / 100 });
      });
      return rows;
    }

    function downloadHasilBelajarPdf() {
      const nis = hasilBelajarState.selectedNis;
      const student = (hasilBelajarState.students || []).find(s => String(s.NIS) === String(nis));
      const rows = getHasilBelajarRows(nis);
      if (!student || !rows.length) { showToast('Pilih siswa yang memiliki nilai terlebih dahulu.', 'warning'); return; }
      if (!window.jspdf || !window.jspdf.jsPDF) {
        showToast('Modul PDF belum selesai dimuat. Tunggu sebentar lalu coba lagi.', 'warning');
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(16);
      doc.text('HASIL BELAJAR SISWA', 105, 18, { align: 'center' });
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.text(`Nama: ${student.Nama || '-'}`, 14, 30);
      doc.text(`NIS: ${student.NIS || '-'}`, 14, 36);
      doc.text(`Kelas: ${student.Kelas || '-'}`, 14, 42);
      doc.text('Nilai akhir = rata-rata seluruh nilai yang tersimpan pada setiap mata pelajaran.', 14, 49);
      const tableBody = rows.map((r, i) => [String(i + 1), r.mapel, Number(r.nilai).toFixed(2)]);
      if (typeof doc.autoTable === 'function') {
        doc.autoTable({
          startY: 55,
          head: [['No', 'Mata Pelajaran', 'Nilai Akhir']],
          body: tableBody,
          theme: 'grid',
          styles: { font: 'helvetica', fontSize: 10, cellPadding: 3 },
          headStyles: { fontStyle: 'bold' },
          columnStyles: { 0: { cellWidth: 15, halign: 'center' }, 2: { cellWidth: 35, halign: 'center' } }
        });
      } else {
        let y = 58;
        doc.setFont('helvetica', 'bold');
        doc.text('No', 15, y); doc.text('Mata Pelajaran', 30, y); doc.text('Nilai Akhir', 160, y);
        doc.setFont('helvetica', 'normal');
        rows.forEach((r, i) => { y += 7; doc.text(String(i + 1), 15, y); doc.text(r.mapel, 30, y); doc.text(Number(r.nilai).toFixed(2), 160, y); });
      }
      const filename = `Hasil_Belajar_${String(student.Nama || student.NIS || 'Siswa').replace(/[^a-z0-9_-]+/gi, '_')}.pdf`;
      doc.save(filename);
      showToast('PDF hasil belajar berhasil dibuat.', 'success');
    }

      if (file.size > 2 * 1024 * 1024) { showToast('Ukuran foto maksimal 2 MB agar localStorage tidak cepat penuh.', 'warning'); event.target.value=''; return; }

          applyGuruIdentityUI();

    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      const keepVoiceActive = voiceActive;
      if (keepVoiceActive && recognition) {
        voiceSpeaking = true;
        try { recognition.stop(); } catch (e) {}
        recognition = null;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(String(text || ''));
      utter.lang = 'id-ID';
      utter.rate = 1;
      utter.onend = () => {
        voiceSpeaking = false;
        if (voiceActive) startVoiceRecognition();
      };
      utter.onerror = () => {
        voiceSpeaking = false;
        if (voiceActive) startVoiceRecognition();
      };
      window.speechSynthesis.speak(utter);
    }

        ]);

        const grades = Array.isArray(gradesRes.data) ? gradesRes.data : [];
        const attendance = Array.isArray(attendanceRes.data) ? attendanceRes.data : [];
        const students = Array.isArray(studentsRes.data) ? studentsRes.data : [];

        // Nilai siswa yang sedang login.

        const bySubject = {};
        myGrades.forEach(g => {
          const code = String(g.KodeMapel || '').trim();

          if (!code || !Number.isFinite(value)) return;
          if (!bySubject[code]) bySubject[code] = [];
          bySubject[code].push(value);
        });

        const subjectName = {};
        subjects.forEach(m => {
          const code = String(m.Kode || '').trim();
          if (code) subjectName[code] = String(m.NamaMapel || code);
        });

        const subjectStats = Object.keys(bySubject).map(code => {
          const arr = bySubject[code];
          const avg = arr.reduce((a,b) => a+b, 0) / arr.length;
          return { code, name: subjectName[code] || code, avg };
        }).sort((a,b) => b.avg - a.avg);

        myAttendance.forEach(a => {

          else if (st === 'izin') counts.izin++;
          else if (st === 'sakit') counts.sakit++;
          else if (st === 'alpa' || st === 'alpha') counts.alpa++;
        });
        const totalAtt = counts.hadir + counts.izin + counts.sakit + counts.alpa;
        const attendancePct = totalAtt ? ((counts.hadir / totalAtt) * 100).toFixed(1) : '0.0';

          if (id) studentMap[id] = { nis:id, nama:String(st.Nama || st.NamaSiswa || id), kelas:String(st.Kelas || '') };

        const sums = {};
        grades.forEach(g => {
          const id = String(g.NIS || '').trim();
          const value = Number(g.Nilai);
          if (!id || !Number.isFinite(value)) return;
          // Rangking dibatasi pada kelas siswa yang sedang login.
          const st = studentMap[id];
          if (!st || (kelas && String(st.kelas).trim() !== kelas)) return;
          if (!sums[id]) sums[id] = { sum:0, count:0 };
          sums[id].sum += value; sums[id].count++;
        });
        const ranking = Object.keys(sums).map(id => ({
          id, nama: studentMap[id].nama, avg:sums[id].sum/sums[id].count
        })).sort((a,b) => b.avg-a.avg || a.nama.localeCompare(b.nama));
        const myRank = ranking.findIndex(x => x.id === nis) + 1;
        const myAvg = myRank > 0 ? ranking[myRank-1].avg : 0;
        const totalRank = ranking.length;
        document.getElementById('siswa-ranking-box').innerHTML = myRank > 0 ? `
          <div class="text-4xl font-extrabold text-amber-500">#${myRank}</div>
          <div class="mt-1 font-bold text-slate-700">dari ${totalRank} siswa</div>
          <div class="text-[11px] text-slate-400 mt-2">Rata-rata nilai: ${myAvg.toFixed(1)}</div>
          <div class="mt-4 text-left space-y-1">
            ${ranking.slice(0,3).map((x,i) => `<div class="flex justify-between text-[11px] ${x.id===nis?'font-bold text-emerald-600':''}"><span>${i+1}. ${escapeHtml(x.nama)}</span><span>${x.avg.toFixed(1)}</span></div>`).join('')}
          </div>` : '<p class="text-xs text-slate-400">Belum cukup data nilai untuk menentukan rangking.</p>';
      } catch (err) {
        const msg = escapeHtml(err && err.message ? err.message : 'Data belum dapat dimuat.');
        document.getElementById('siswa-mapel-stats').innerHTML = `<p class="text-xs text-red-500">${msg}</p>`;
        document.getElementById('siswa-attendance-box').innerHTML = '<p class="text-xs text-slate-400">Data kehadiran belum dapat dimuat.</p>';
        document.getElementById('siswa-ranking-box').innerHTML = '<p class="text-xs text-slate-400">Rangking belum dapat dihitung.</p>';
      }
    }

    // VOICE ASSISTANT ENGINE (WEB SPEECH API)

    let recognition = null;
    let voiceActive = false;
    let voiceRestartTimer = null;
    let voiceSpeaking = false;

    function getSpeechRecognitionCtor() {
      return window.SpeechRecognition || window.webkitSpeechRecognition || null;
    }

    function updateVoiceButtonState() {
      document.querySelectorAll('.voice-control-btn').forEach(btn => {
        btn.classList.toggle('voice-active', voiceActive);
        btn.title = voiceActive ? 'Matikan Asisten Suara' : 'Aktifkan Asisten Suara';
        const label = btn.querySelector('span');
        if (label) label.textContent = voiceActive ? 'Mendengarkan...' : 'Bicara';
        const icon = btn.querySelector('i');
        if (icon) {
          icon.className = voiceActive ? 'fa-solid fa-microphone-lines' : 'fa-solid fa-microphone';
        }
      });
    }

    function stopVoiceRecognition(silent = false) {
      voiceActive = false;
      if (voiceRestartTimer) { clearTimeout(voiceRestartTimer); voiceRestartTimer = null; }
      if (recognition) {
        try { recognition.onend = null; recognition.onerror = null; recognition.stop(); } catch (e) {}
      }
      recognition = null;
      updateVoiceButtonState();
      if (!silent) showToast('🎙️ Asisten suara dimatikan.', 'info');
    }

    function startVoiceRecognition() {
      const SpeechRecognition = getSpeechRecognitionCtor();
      if (!SpeechRecognition || !voiceActive || voiceSpeaking) return;
      if (recognition) return;

      recognition = new SpeechRecognition();
      recognition.lang = 'id-ID';
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        updateVoiceButtonState();
        showToast('🎙️ Asisten suara aktif. Silakan beri perintah...', 'info');
      };

      recognition.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (!e.results[i].isFinal) continue;
          const cmd = String(e.results[i][0].transcript || '').trim();
          if (!cmd) continue;
          showToast(`Perintah diterima: "${cmd}"`, 'success');
          processVoiceCommand(cmd);
        }
      };

      recognition.onerror = (e) => {
        const err = String(e && e.error || '');
        // no-speech/audio-capture sering terjadi ketika recognition otomatis restart.
        // Selama pengguna belum mematikan mikrofon, kita tetap mencoba mendengarkan.
        if (!voiceActive) return;
        if (err === 'not-allowed' || err === 'service-not-allowed') {
          stopVoiceRecognition(true);
          showToast('Akses mikrofon ditolak. Izinkan mikrofon di browser lalu klik Bicara lagi.', 'error');
          return;
        }
        if (err === 'audio-capture') {
          showToast('Mikrofon tidak tersedia. Periksa izin/perangkat mikrofon.', 'warning');
        }
      };

      recognition.onend = () => {
        recognition = null;
        if (!voiceActive || voiceSpeaking) return;
        clearTimeout(voiceRestartTimer);
        voiceRestartTimer = setTimeout(() => {
          voiceRestartTimer = null;
          startVoiceRecognition();
        }, 250);
      };

      try {
        recognition.start();
      } catch (e) {
        recognition = null;
        if (voiceActive) {
          clearTimeout(voiceRestartTimer);
          voiceRestartTimer = setTimeout(() => {
            voiceRestartTimer = null;
            startVoiceRecognition();
          }, 500);
        }
      }
    }

    function toggleVoiceListening() {
      const SpeechRecognition = getSpeechRecognitionCtor();
      if (!SpeechRecognition) {
        showToast('Browser ini belum mendukung Web Speech API. Gunakan Google Chrome/Edge dan izinkan mikrofon.', 'warning');
        return;
      }
      if (voiceActive) {
        stopVoiceRecognition(false);
        return;
      }
      voiceActive = true;
      updateVoiceButtonState();
      startVoiceRecognition();
    }

    function processVoiceCommand(cmd) {
      if (!currentUser) return;
      const normalized = String(cmd || '').trim();
      if (!normalized) return;
      if (String(currentUser.Role || '').trim().toLowerCase() === 'guru') {
        processVoiceCommandGuru(normalized);

        processVoiceCommandStudent(normalized.toLowerCase());

    function processVoiceCommandGuru(cmd) {
      const low = cmd.toLowerCase().replace(/[.!?]+$/g, '').trim();

      // Konfirmasi nilai yang sedang menunggu.
      if (window.pendingHaloGrade && /^(ya|iya|yes|oke|ok|simpan|lanjut|setuju)\b/.test(low)) {
        confirmHaloGrade();
        return;
      }
      if (window.pendingHaloGrade && /^(batal|tidak|nggak|jangan|cancel)\b/.test(low)) {
        window.pendingHaloGrade = null;
        appendAiChat('Halo-Halo', 'Baik, penyimpanan dibatalkan.', false);
        speakText('Baik, penyimpanan dibatalkan.');
        return;
      }

      // Navigasi langsung supaya perintah dasar tidak bergantung pada AI/API.
      const routes = [
        ['dashboard', 'dashboard'],
        ['data siswa', 'data-siswa'],
        ['master mapel', 'master-mapel'],
        ['mata pelajaran', 'master-mapel'],
        ['absensi', 'absensi'],
        ['penilaian', 'penilaian'],
        ['hasil belajar', 'hasil-belajar'],
        ['jurnal harian', 'jurnal'],
        ['jurnal', 'jurnal'],
        ['pengumuman', 'pengumuman'],
        ['asisten ai', 'asisten-ai'],
        ['asisten suara', 'asisten-ai'],
        ['profil guru', 'profil-guru']
      ];
      for (const [phrase, view] of routes) {
        if (low === phrase || low === 'buka ' + phrase || low === 'tampilkan ' + phrase || low === 'ke ' + phrase) {
          navigateTo(view);
          speakText('Baik, saya buka ' + phrase + '.');
          return;
        }
      }

      // Contoh: "buka master mapel, tambah mapel bahasa jawa"
      const addSubjectMatch = low.match(/(?:buka\s+)?(?:master\s+mapel|mata\s+pelajaran)[,;\s]+(?:dan\s+)?(?:tambah|buat|masukkan)\s+(?:mapel|mata\s+pelajaran)\s+(.+)$/i);
      if (addSubjectMatch) {
        const name = addSubjectMatch[1].trim().replace(/^(yang\s+bernama\s+)/i, '');
        navigateTo('master-mapel');
        setTimeout(() => openVoiceSubjectForm(name), 100);
        return;
      }

      const addSubjectOnly = low.match(/^(?:tambah|buat|masukkan)\s+(?:mapel|mata\s+pelajaran)\s+(.+)$/i);
      if (addSubjectOnly) {
        const name = addSubjectOnly[1].trim();
        navigateTo('master-mapel');
        setTimeout(() => openVoiceSubjectForm(name), 100);
        return;
      }

      // Perintah lain diteruskan ke Halo-Halo/AI agar dapat menangani intent yang lebih kompleks.
      sendAiMessage(cmd);
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    function downloadExcelTemplate(type) {
      const cfg = EXCEL_CONFIG[type];
      if (!cfg || typeof XLSX === 'undefined') { showToast('Library Excel belum siap.', 'error'); return; }
      const example = {};
      cfg.headers.forEach(h => example[h] = '');
      if (type === 'siswa') Object.assign(example, {NIS:'1004',NISN:'0051234564',Nama:'Nama Siswa',JenisKelamin:'L',TempatLahir:'Malang',TanggalLahir:'2010-01-01',Alamat:'Alamat lengkap',Kelas:'VII-A',NamaOrangTua:'Nama Orang Tua',NoHP:'08123456789',Status:'aktif'});
      if (type === 'mapel') Object.assign(example, {Kode:'IPA-7',NamaMapel:'IPA Terpadu',Guru:'Nama Guru',Kelas:'VII-A',Status:'aktif'});
      if (type === 'absensi') Object.assign(example, {ID:'ABS-001',Tanggal:new Date().toISOString().slice(0,10),Kelas:'VII-A',KodeMapel:'MTK-7',NIS:'1001',NamaSiswa:'Ahmad Rizky',StatusHadir:'Hadir'});
      if (type === 'nilai') Object.assign(example, {ID:'NIL-001',Kelas:'VII-A',KodeMapel:'MTK-7',NIS:'1001',NamaSiswa:'Ahmad Rizky',JenisPenilaian:'Tugas',Nilai:85,Tanggal:new Date().toISOString().slice(0,10)});
      if (type === 'jurnal') Object.assign(example, {ID:'JRN-001',Tanggal:new Date().toISOString().slice(0,10),Kelas:'VII-A',KodeMapel:'MTK-7',Materi:'Materi pembelajaran',Kegiatan:'Kegiatan pembelajaran',Catatan:'Catatan tambahan'});
      if (type === 'pengumuman') Object.assign(example, {ID:'PG-001',Tanggal:new Date().toISOString().slice(0,10),Judul:'Pengumuman Sekolah',Isi:'Isi pengumuman',TargetRole:'Semua',TargetKelas:'Semua',Pembuat:currentUser ? currentUser.Nama : 'Guru'});
      const ws = XLSX.utils.json_to_sheet([example], {header: cfg.headers});
      ws['!cols'] = cfg.headers.map(h => ({wch: Math.max(12, Math.min(28, h.length + 5))}));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, cfg.sheet);
      XLSX.writeFile(wb, cfg.filename);
      showToast('Template berhasil diunduh.', 'success');
    }

    function openExcelImportModal(type) {
      const cfg = EXCEL_CONFIG[type];
      if (!cfg) return;
      const required = cfg.required.map(h => `<span class="px-2 py-1 bg-indigo-50 text-indigo-700 rounded-lg">${h}</span>`).join(' ');
      openModal(`
        <div class="space-y-4">
          <div class="border-b pb-3">
            <h3 class="text-xl font-bold text-slate-800">${cfg.title}</h3>
            <p class="text-xs text-slate-500 mt-1">Unduh template, isi data, lalu upload kembali dalam format .xlsx atau .xls.</p>
          </div>
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
            <b>Kolom wajib:</b><div class="flex flex-wrap gap-1.5 mt-2">${required}</div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <button onclick="downloadExcelTemplate('${type}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2"><i class="fa-solid fa-file-arrow-down"></i> Download Template</button>
            <label class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 cursor-pointer"><i class="fa-solid fa-file-import"></i> Pilih File Excel<input id="excel-file-input" type="file" accept=".xlsx,.xls" class="hidden" onchange="handleExcelFileSelected('${type}', this)"></label>
          </div>
          <div id="excel-preview-area" class="hidden"></div>
        </div>
      `);
    }

    async function handleExcelFileSelected(type, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!/\.(xlsx|xls)$/i.test(file.name)) { showToast('File harus berformat .xlsx atau .xls.', 'warning'); return; }
      try {
        const cfg = EXCEL_CONFIG[type];
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, {type:'array', cellDates:true});
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, {defval:'', raw:false});
        const normalized = rows.map(row => {
          const obj = {}; cfg.headers.forEach(h => obj[h] = row[h] == null ? '' : String(row[h]).trim()); return obj;
        });
        const validation = validateExcelRows(cfg, normalized);
        const area = document.getElementById('excel-preview-area');
        area.classList.remove('hidden');
        if (!validation.valid) {
          area.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 text-xs"><b>Validasi gagal:</b><ul class="list-disc list-inside mt-1">${validation.errors.slice(0,30).map(escapeHtml).map(e=>`<li>${e}</li>`).join('')}</ul></div>`;
          return;
        }
        window.pendingExcelImport = {type, records: normalized};
        const previewRows = normalized.slice(0,8);
        area.innerHTML = `
          <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-3 text-xs mb-3"><b>${normalized.length} baris siap diimport.</b> Periksa preview sebelum menyimpan.</div>
          <div class="overflow-auto border rounded-xl max-h-56"><table class="w-full text-[10px]"><thead class="bg-slate-50"><tr>${cfg.headers.map(h=>`<th class="p-2 text-left whitespace-nowrap">${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${previewRows.map(r=>`<tr class="border-t">${cfg.headers.map(h=>`<td class="p-2 whitespace-nowrap">${escapeHtml(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <div class="flex justify-end gap-2 mt-3"><button onclick="closeModal()" class="px-4 py-2 rounded-xl border text-xs font-semibold">Batal</button><button onclick="confirmExcelImport()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"><i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Database</button></div>`;
      } catch (err) { showToast('Gagal membaca Excel: ' + err.message, 'error'); }
    }

    function validateExcelRows(cfg, rows) {
      const errors = [];
      if (!rows.length) return {valid:false, errors:['File Excel tidak memiliki data.']};
      rows.forEach((r,i) => {
        cfg.required.forEach(h => { if (!String(r[h] || '').trim()) errors.push(`Baris ${i+2}: kolom ${h} wajib diisi.`); });
        if (cfg.sheet === 'Siswa' && r.JenisKelamin && !['L','P','Laki-laki','Perempuan'].includes(r.JenisKelamin)) errors.push(`Baris ${i+2}: JenisKelamin harus L/P.`);
        if (cfg.sheet === 'Absensi' && r.StatusHadir && !['Hadir','Izin','Sakit','Alpa'].includes(r.StatusHadir)) errors.push(`Baris ${i+2}: StatusHadir tidak valid.`);
        if (cfg.sheet === 'Nilai' && (Number(r.Nilai) < 0 || Number(r.Nilai) > 100 || isNaN(Number(r.Nilai)))) errors.push(`Baris ${i+2}: Nilai harus angka 0-100.`);
      });
      const seen = {};
      rows.forEach((r,i) => { const k=String(r[cfg.key]||'').trim(); if(k){ if(seen[k]) errors.push(`Baris ${i+2}: ${cfg.key} duplikat dengan baris ${seen[k]}.`); else seen[k]=i+2; } });
      return {valid: errors.length===0, errors};
    }

    async function confirmExcelImport() {
      const pending = window.pendingExcelImport;
      if (!pending) return;
      const cfg = EXCEL_CONFIG[pending.type];
      const res = await apiCall(cfg.action, {}, {records: pending.records});
      if (res.success) {
        const d = res.data || {};
        showToast(`Import selesai. Tambah: ${d.inserted || 0}, Update: ${d.updated || 0}, Lewati: ${d.skipped || 0}`, 'success');
        window.pendingExcelImport = null; closeModal(); refreshAfterImport(pending.type);
      } else showToast(res.message || 'Import gagal.', 'error');
    }

    function refreshAfterImport(type) {
      const map = {siswa:'data-siswa', mapel:'master-mapel', absensi:'absensi', nilai:'penilaian', jurnal:'jurnal'};
      navigateTo(map[type]);
    }

    // Utility for Excel Export
    function exportToExcel(tableID, filename = '') {
      const table = document.getElementById(tableID);
      let html = table.outerHTML;
      let url = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
      let downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = (filename || 'export') + '.xls';
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }
  </script>
</body>
</html>
